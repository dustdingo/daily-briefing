","Moondog","Stephanie Lippi"],"creative":{"date":"Oct 8","title":"","summary":"","paragraphs":["One of the keys to unlocking your creative voice is asking yourself: “What angers me?” I’m not talking about road rage or a disappointing season of your favorite TV show. I mean what fills you with compassionate anger.","Compassionate anger is anger on behalf of someone else. It’s anger that you feel because there is a wrong that needs to be righted or there is an injustice happening around you. It’s anger that you feel when someone isn’t delivering on their promises or you see a customer or client being taken advantage of. It’s anger that you feel when an inferior product is causing problems for your customers.","For example, I am profoundly moved by the stories of underdogs. If I see someone being taken advantage of or who is working against incredible odds, I immediately spring into action and take their side. Some of my best work is done with underdogs.","What fills you with compassionate anger? And, more importantly, how can you channel that into work that matters to you and the world around you?","Sometimes, your best creative work will arise when you are working against something or when you are fighting something."],"question":"What fills you with compassionate anger?"}},"fitness":{"eyebrow":"Thursday · Off Day Circuit","stats":[{"value":"228.3","label":"lb weekly avg"},{"value":"0.5","label":"lb/wk lost (3-4 wks)"},{"value":"2,072","label":"avg kcal (7 days)"},{"value":"169","label":"avg protein g"}],"progress":[{"label":"Weight","text":"228.3 lb avg (3 weigh-ins this week), losing 0.5 lb/wk; goal needs 1.2 lb/wk; sustainable range 1.1-2.3 lb/wk. Below 0.5%, so progress has stalled."},{"label":"Nutrition","text":"Sep 29 to Oct 5: 2,072 kcal avg vs 2,308, 169g protein vs 200, 5 of 7 days at 180g+. Low days were Oct 1 (138g) and Sat Oct 3 (115g). Oct 6 and 7 have no meals logged."},{"label":"Strength","text":"Leg press 205 to 250 lb, DB bench up to 50 lb, row stea
