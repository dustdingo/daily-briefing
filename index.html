at we saw in the vision, not simply live in ecstatic delight and conscious reflection upon God. This means living the realities of our lives in the light of the vision until the truth of the vision is actually realized in us. Every bit of our training is in that direction. Learn to thank God for making His demands known.","Our little “I am” always sulks and pouts when God says do . Let your little “I am” be shriveled up in God’s wrath and indignation—“I AM WHO I AM . . . has sent me to you” (Exodus 3:14). He must dominate. Isn’t it piercing to realize that God not only knows where we live, but also knows the gutters into which we crawl! He will hunt us down as fast as a flash of lightning. No human being knows human beings as God does."]},"prayer":["Micah Kongkousonh’s family","Jirah","Russo","Carrie Davis","Moondog","Stephanie Lippi"],"creative":{"date":"Oct 4","title":"","summary":"","paragraphs":["If you aim from the start for only practical ideas, you are likely to end up with very predictable and possibly very stale projects. It’s rare that an idea goes from boringly safe to edgy and cool during the course of a project. Typically, ideas that feel like a bit of a stretch are toned down in order to make them more practical.","Because of this, at the start of a project you should aim for the sky. Be wild, imaginative, and thoroughly impractical. Come up with ideas that could never work in practice. However, what you discover in those initial impractical ideas is often a spark that leads to much more practical, yet still novel concept.","When you aim for practical, you typically wind up with predictable and stale projects.","When you aim for the impossible, you often wind up with simultaneously practical and interesting ideas.","Remember: ideas are easy and cheap. It’s not dangerous to have one. Don’t shy away from letting your mind run wild just because you fear you won’t be able to implement it.","Aim for the sky with your ideas and sometimes you’ll surprise your
