*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4}

to understand others.","We rarely see what God is doing at the time, but later realize He has strengthened us."],"fullText":["“. . . but rejoice to the extent that you partake of Christ’s sufferings . . . .”","If you are going to be used by God, He will take you through a number of experiences that are not meant for you personally at all. They are designed to make you useful in His hands, and to enable you to understand what takes place in the lives of others. Because of this process, you will never be surprised by what comes your way. You say, “Oh, I can’t deal with that person.” Why can’t you? God gave you sufficient opportunities to learn from Him about that problem; but you turned away, not heeding the lesson, because it seemed foolish to spend your time that way.","The sufferings of Christ were not those of ordinary people. He suffered “according to the will of God” (1 Peter 4:19), having a different point of view of suffering from ours. It is only through our relationship with Jesus Christ that we can understand what God is after in His dealings with us. When it comes to suffering, it is part of our Christian culture to want to know God’s purpose beforehand. In the history of the Christian church, the tendency has been to avoid being identified with the sufferings of Jesus Christ. People have sought to carry out God’s orders through a shortcut of their own. God’s way is always the way of suffering—the way of the “long road home.”","Are we partakers of Christ’s sufferings? Are we prepared for God to stamp out our personal ambitions? Are we prepared for God to destroy our individual decisions by supernaturally transforming them? It will mean not knowing why God is taking us that way, because knowing would make us spiritually proud. We never realize at the time what God is putting us through—we go through it more or less without understanding. Then suddenly we come to a place of enlightenment, and realize—“God has strengthened me and I didn’t even know it!”"]},"creative":{"date":"Nov 5","title":"","summary":"","paragraphs":["Author and artist Austin Kleon wrote, “Lots of people want to be the noun without doing the verb.” This means they want to be thought of as a certain kind of person—a writer, a painter, a musician, an editor—without doing the hard work necessary to actually do the work. To them, it’s more about being a certainkindof person than doing the actual work that person would do.","Of course, to be any of those things, you have to do the things those people do. If you want to be a writer, you must write consistently. If you want to be a musician, you must make music. If you want to be a leader, well…lead. If more people focused on the verbs instead of the nouns, the world would certainly be filled with compelling work. And if you focus more on the verbs, you will make steady progress on your goals.","If you’re not yet the thing youwantto be, begin doing the thing that person does. Write every day. Make music. Build the business, one day at a time.","If you want to be the noun, focus on doing the verb."],"question":"What verb should you do more consistently to help you become the noun?"},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Phillip - Reconciliation with his Sisters","Eliana Gale - Dropped Class","Jirah","Moondog","Stephanie Lippi"]},"fitness":{"eyebrow":"Tomorrow · Friday · Legs & Shoulders","stats":[{"value":"2,308","label":"kcal target"},{"value":"200","label":"g protein target"},{"value":"9","label":"days since last reconciled food export"}],"progress":[{"label":"Weight","text":"Not readable today. Wellness hit its daily limit of 3 analysis calls before this run."},{"label":"Nutrition","text":"No reconciled food data since Oct 27. Today's export email arrived, but the Mac download didn't run."},{"label":"Strengt
