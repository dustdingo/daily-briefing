on his master, our eyes should be directed to and focused on God. This is how knowledge of His countenance is gained and how God reveals Himself to us (see Isaiah 53:1). Our spiritual strength begins to be drained when we stop lifting our eyes to Him. Our stamina is sapped, not so much through external troubles surrounding us but through problems in our thinking. We wrongfully think, “I suppose I’ve been stretching myself a little too much, standing too tall and trying to look like God instead of being an ordinary humble person.” We have to realize that no effort can be too high.","For example, you came to a crisis in your life, took a stand for God, and even had the witness of the Spirit as a confirmation that what you did was right. But now, maybe weeks or years have gone by, and you are slowly coming to the conclusion—“Well, maybe what I did showed too much pride or was superficial. Was I taking a stand a bit too high for me?” Your “rational” friends come and say, “Don’t be silly. We knew when you first talked about this spiritual awakening that it was a passing impulse, that you couldn’t hold up under the strain. And anyway, God doesn’t expect you to endure.” You respond by saying, “Well, I suppose I was expecting too much.” That sounds humble to say, but it means that your reliance on God is gone, and you are now relying on worldly opinion. The danger comes when, no longer relying on God, you neglect to focus your eyes on Him. Only when God brings you to a sudden stop will you realize that you have been the loser. Whenever there is a spiritual drain in your life, correct it immediately. Realize that something has been coming between you and God, and change or remove it at once."]},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Phillip - Reconciliation with his Sisters","Eliana Gale - Dropped Class","Josie - Brother’s Faith, workplace relationship","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Nov 24","title":"","summary":"","paragraphs":["I’ve always preferred the termthankfulnessovergratitude. When I express that I am thankful, it means that I’m full of thanks. I’m filled up.","It’s easy to turn your eyes to the next thing—the next project, the next meeting—without pausing to express thankfulness for the good thing that just happened.","Did an idea appear out of nowhere that solved an important problem?","Was a conflict resolved?","Did you read something that helped you understand a topic in a new way?","It’s important to pause in those moments when something good happens and allow yourself to be full of thanks. Reflect on your good fortune, not in a pandering way but in a way that recognizes how very different things could actually be. Mark the moment.","What are you thankful for?","Why?","What does it mean to you?","Making the practice of thankfulness a part of your rhythm will open your mind to new opportunities, new creative possibilities, and new relationships. (People want to be around those who are full of thanks!)","Make the practice of thankfulness a part of your rhythm. Pause to be full of thanks when something good happens in your life or work."],"question":"Take a few minutes today to pause and be full of thanks. What do you have to be thankful for?"}},"fitness":{"eyebrow":"Tomorrow · Wednesday · Back & Triceps","stats":[{"value":"227.4","label":"lb, Nov 12 weigh-in"},{"value":"2,164","label":"avg kcal, 3 full days Nov 19-21"},{"value":"133","label":"avg protein g, same days"},{"value":"6.7","label":"avg sleep h, 4 nights"}],"progress":[{"label":"Weight","text":"No weigh-in since 227.4 lb on Nov 12, twelve days ago, so no weekly average. Goal 199 by Mar 28 needs about 1.6 lb/wk, inside the sustainable 1.1-2.3 lb/wk."},{"label":"Nutrition","text":"Last 7 days: only three full days (Nov 19, 20, 21), averaging 2,
