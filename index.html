*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4}
button{font-family:inherit}
.app{display:flex;flex-direction:column;min-height:100vh}
.main{flex:1 1 auto;min-width:0;order:1;padding-top:env(safe-area-inset-top,0)}
.page{max-width:1180px;margin:0 auto}
.nav{order:2;position:sticky;bottom:0;z-index:5;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(10px + env(safe-area-inset-bottom,0))}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;flex:1 1 0;min-width:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;color:var(--muted);font-size:11px;font-weight:600}
.nav button[aria-pressed="true"]{color:var(--accentText);background:var(--bg)}
.nav button:focus-visible,.seg button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:520px){.nav{padding-left:2px;padding-right:2px}.nav button{font-size:11px;border-radius:12px}}
@media (min-width:860px){
  .app{flex-direction:row}
  .nav{order:0;top:0;bottom:auto;align-self:flex-start;height:100vh;width:108px;flex:0 0 108px;flex-direction:column;justify-content:flex-start;gap:6px;padding:24px 10px;border-top:0;border-right:1px solid var(--line)}

.head{padding:28px 24px 4px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--display);font-size:36px;line-height:1.05;font-weight:800;letter-spacing:-.02em}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start;padding:16px 24px 32px}

.span{grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.card.warn{background:var(--warnBg);border-color:var(--warnLine)}

.col{display:flex;flex-direction:column}

.r-speaking{--rc:var(--speaking);--rb:var(--speakingBg)}

.chip{flex:0 0 auto;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--rb);color:var(--rc)}
.dot{flex:0 0 auto;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rc)}

.bar.lg{height:10px}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar>i.rc{background:var(--rc)}
.bar>i.ok{background:var(--ok)}
.big{font-family:var(--display);font-weight:800;line-height:1;letter-spacing:-.03em}
.hero p{margin:0 0 12px;line-height:1.5}
.hero a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--onAccent);color:var(--accentText);font-weight:600;font-size:16px;text-decoration:none}
.note{margin-top:16px;padding:14px;border-radius:14px;background:var(--bg);font-size:16px;font-weight:600}
.foot{grid-column:1/-1;font-size:12px;color:var(--muted);text-align:center}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.stat span{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.cal .r{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:16px}
.cal .d{flex:0 0 76px;font-size:13px;font-weight:600}
.cal .fyi{color:var(--muted)}

.days>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}

"end":"13:00"},{"date":"2026-12-16","day":"","time":"1:00 PM","title":"Margaret & Creative: The Trilogy","fyi":false,"start":"13:00","end":"14:00"},{"date":"2026-12-16","day":"","time":"6:30 PM","title":"MDWK","fyi":false,"start":"18:30","end":"20:30"},{"date":"2026-12-17","day":"Thu 12/17","time":"All day","title":"1/2 Day","fyi":false},{"date":"2026-12-17","day":"","time":"All day","title":"Megan Keller, birthday! (1984)","fyi":false},{"date":"2026-12-17","day":"","time":"6:00 PM","title":"Avengers: Doomsday (2026)","fyi":false,"start":"18:00","end":"21:00"},{"date":"2026-12-18","day":"Fri 12/18","time":"All day","title":"Christmas Break (through Jan 5)","fyi":false}]}]},"schemaVersion":1,"title":"Briefing 11-20","date":"2026-11-20","dateLabel":"Friday, November 20","generatedAt":"Friday, November 20, 2026 at 4:21 AM ET","reading":{"devotional":{"series":"My Utmost for His Highest","date":"Nov 20","title":"THE FORGIVENESS OF GOD","reference":"Ephesians 1:7","summary":["God forgives only on the ground of the Cross; forgiveness is easy for us to accept because it cost God Calvary.","Sanctification is the evidence of forgiveness, and realizing what it cost God holds us in His love."],"fullText":["“In Him we have . . . the forgiveness of sins . . . .”","Beware of the pleasant view of the fatherhood of God: God is so kind and loving that of course He will forgive us. That thought, based solely on emotion, cannot be found anywhere in the New Testament. The only basis on which God can forgive us is the tremendous tragedy of the Cross of Christ. To base our forgiveness on any other ground is unconscious blasphemy. The only ground on which God can forgive our sin and reinstate us to His favor is through the Cross of Christ. There is no other way! Forgiveness, which is so easy for us to accept, cost the agony at Calvary. We should never take the forgiveness of sin, the gift of the Holy Spirit, and our sanctification in simple faith, and then forget the enormous cost to God that made all of this ours.","Forgiveness is the divine miracle of grace. The cost to God was the Cross of Christ. To forgive sin, while remaining a holy God, this price had to be paid. Never accept a view of the fatherhood of God if it blots out the atonement. The revealed truth of God is that without the atonement He cannot forgive—He would contradict His nature if He did. The only way we can be forgiven is by being brought back to God through the atonement of the Cross. God’s forgiveness is possible only in the supernatural realm.","Compared with the miracle of the forgiveness of sin, the experience of sanctification is small. Sanctification is simply the wonderful expression or evidence of the forgiveness of sins in a human life. But the thing that awakens the deepest fountain of gratitude in a human being is that God has forgiven his sin. Paul never got away from this. Once you realize all that it cost God to forgive you, you will be held as in a vise, constrained by the love of God."]},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Phillip - Reconciliation with his Sisters","Eliana Gale - Dropped Class","Josie - Brother’s Faith, workplace relationship","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Nov 20","title":"","summary":"","paragraphs":["Some workplaces like to parade the notion that their work culture is a family. No! The workplace is not a family. Family membership is unconditional and is not contingent on performance. On the other hand, a job is contingent on delivering on expectations and maintaining appropriate behavior, and at any point, your employment can be revoked if you don’t measure up.","When companies talk about work culture as a family, they give people a false sense of security that really shouldn’t be there. Yes, it’s important to feel psychologically safe, but at no point should the signal be sent that work peers are similar to their bloodline.","Why is this important? Because whether you lead a team or are on one, it’s easy to slip into this family mindset out of insecurity. It’s important to have a clear understanding of where you stand in relation to your manager, your peers, and the people you lead and to not allow insecurity to cause you to make promises you can’t keep or expect treatment that is unrealistic.","Don’t confuse your work team for your family. Teams are not family."],"question":"Question: Do you consider your work team a family? How might you adapt those perceptions to be more accurate?"}}}</script>
