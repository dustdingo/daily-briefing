edience. But as soon as he chooses to disobey, an inherent inner conflict is produced. On the spiritual level, inner conflict is the warning of the Spirit of God. When He warns us in this way, we must stop at once and be renewed in the spirit of our mind to discern God’s will (see Romans 12:2). If we are born again by the Spirit of God, our devotion to Him is hindered, or even stopped, by continually asking Him to guide us here and there. “. . . the Lord led me . . .” and on looking back we see the presence of an amazing design. If we are born of God we will see His guiding hand and give Him the credit.","We can all see God in exceptional things, but it requires the growth of spiritual discipline to see God in every detail. Never believe that the so-called random events of life are anything less than God’s appointed order. Be ready to discover His divine designs anywhere and everywhere.","Beware of being obsessed with consistency to your own convictions instead of being devoted to God. If you are a saint and say, “I will never do this or that,” in all probability this will be exactly what God will require of you. There was never a more inconsistent being on this earth than our Lord, but He was never inconsistent with His Father. The important consistency in a saint is not to a principle but to the divine life. It is the divine life that continually makes more and more discoveries about the divine mind. It is easier to be an excessive fanatic than it is to be consistently faithful, because God causes an amazing humbling of our religious conceit when we are faithful to Him."]},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Phillip - Reconciliation with his Sisters","Eliana Gale - Dropped Class","Jirah","Moondog","Stephanie Lippi\nCALENDAR EVENTS:\nRecords “U2 Listening Party” (Ca
