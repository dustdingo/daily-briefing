of break, and the Lindsey Stirling concert tonight.","best":"Keep the afternoon free for family and eat an early dinner before the show.","watch":"Late night tonight before church tomorrow."}]},"reading":{"devotional":{"series":"My Utmost for His Highest","date":"Nov 28","title":"THE RICHES OF THE DESTITUTE","reference":"Romans 3:24","summary":["Grace offends our pride because it can only be received, not earned.","The door into God's kingdom is the honest admission that we are destitute."],"fullText":["“. . . being justified freely by His grace . . . .”","The gospel of the grace of God awakens an intense longing in human souls and an equally intense resentment, because the truth that it reveals is not palatable or easy to swallow. There is a certain pride in people that causes them to give and give, but to come and accept a gift is another thing. I will give my life to martyrdom; I will dedicate my life to service—I will do anything. But do not humiliate me to the level of the most hell-deserving sinner and tell me that all I have to do is accept the gift of salvation through Jesus Christ.","We have to realize that we cannot earn or win anything from God through our own efforts. We must either receive it as a gift or do without it. The greatest spiritual blessing we receive is when we come to the knowledge that we are destitute. Until we get there, our Lord is powerless. He can do nothing for us as long as we think we are sufficient in and of ourselves. We must enter into His kingdom through the door of destitution. As long as we are “rich,” particularly in the area of pride or independence, God can do nothing for us. It is only when we get hungry spiritually that we receive the Holy Spirit. The gift of the essential nature of God is placed and made effective in us by the Holy Spirit. He imparts to us the quickening life of Jesus, making us truly alive. He takes that which was “beyond” us and places it “within” us. And immediately, once “the beyond” has come “within,” it rises up to “the above,” and we are lifted into the kingdom where Jesus lives and reigns (see John 3:5)."]},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Phillip - Reconciliation with his Sisters","Eliana Gale - Dropped Class","Josie - Brother’s Faith, workplace relationship","Joseph - Rejection and a busy semester","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Nov 28","title":"","summary":"","paragraphs":["I once had a wonderful conversation with Richard Hytner, who was the former global deputy chairman of advertising great Saatchi and Saatchi. He told me that he spent many years of his professional life striving to climb the ladder and become the person in the organizational spotlight. He wanted to be the CEO of a publicly traded company, because it had become engrained in him that to aspire to any less was unacceptable.","The problem, as Richard conveyed, was that he simply wasn’t wired to be CEO. He thrived as the “number two” in an organization, driving alignment, developing strategy, helping bring the CEO’s vision into being, but he simply wasn’t the right person to be in the spotlight. He learned that it was better to thrive at what you’re wired to do than to aspire to something that others tell you that you should want.","There are many narratives in the marketplace that shape the aspirations of creative pros. In the “up or out” ethic of many organizations, you’re deemed unmotivated and unambitious if you don’t aspire to be on top. However, I encourage you to consider that your life and career might be far more productive and enjoyable if you make decisions according to who you are, not according to who others want you to be.","Know yourself. Don’t make career decisions according to what other people would do in your situation."],"question":"Question:
