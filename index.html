in of God and are indwelt by the Spirit of God, He expresses for us the unutterable.","“He,” the Holy Spirit in you, “makes intercession for the saints according to the will of God” (8:27). And God searches your heart, not to know what your conscious prayers are, but to find out what the prayer of the Holy Spirit is.","The Spirit of God uses the nature of the believer as a temple in which to offer His prayers of intercession. “. . . your body is the temple of the Holy Spirit . . .” (1 Corinthians 6:19). When Jesus Christ cleansed the temple, “. . . He would not allow anyone to carry wares through the temple” (Mark 11:16). The Spirit of God will not allow you to use your body for your own convenience. Jesus ruthlessly cast out everyone who bought and sold in the temple, and said, “My house shall be called a house of prayer . . . . But you have made it a ‘den of thieves’ ” (Mark 11:17).","Have we come to realize that our “body is the temple of the Holy Spirit”? If so, we must be careful to keep it undefiled for Him. We have to remember that our conscious life, even though only a small part of our total person, is to be regarded by us as a “temple of the Holy Spirit.” He will be responsible for the unconscious part which we don’t know, but we must pay careful attention to and guard the conscious part for which we are responsible."]},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Phillip - Reconciliation with his Sisters","Eliana Gale - Dropped Class","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Nov 8","title":"","summary":"","paragraphs":["NPR radio host Ira Glass once shared insight into the struggle of making great art: “What nobody tells people who are beginners—and I really wish someone had told this to me—is that all of us who do creative work, we get into it because we have good taste… But it’s like there’s a gap. That for the first couple years that you’re making stuff, what you’re making isn’t so good… It’s trying to be good, it has ambition to be good, but it’s not quite that good.”","However, Glass said that the key to producing work you’re proud of is to follow your creative instincts as you develop your skills. “A lot of people never get past that phase. A lot of people at that point, they quit… Most everybody I know who does interesting creative work, they went through a phase of years… It is only by actually going through a volume of work that you are actually going to catch up and close that gap. And the work you’re making will be as good as your ambitions… It’s going to take you a while. It’s normal to take a while. And you just have to fight your way through.”","It’s natural to feel disappointed with the work you make. However, you must push through that discomfort and continue to create until your work catches up to your aspirations."],"question":"Question: Where are you currently disappointed that your work doesn’t live up to your aspirations? Don’t quit. Keep developing."}},"fitness":{"eyebrow":"Sunday · Rest day","stats":[{"value":"199","label":"lb goal by Mar 28"},{"value":"20","label":"weeks to goal"},{"value":"1","label":"strength session this week"},{"value":"12","label":"days since last food export"}],"progress":[{"label":"Weight","text":"Couldn't read weigh-ins today (Wellness hit its 3-call daily limit). Goal: 199 lb by Mar 28 from a 227.8 lb start."},{"label":"Nutrition","text":"Not readable today, and MyFitnessPal hasn't reconciled since Oct 27, so the last 12 days in Wellness may be missing food."},{"label":"Strength","text":"One session this week (Upper, Mon Nov 2) and one last week (Upper, Fri Oct 30). No legs-and-shoulders or circuit sessions show in Wellness since Oct 25."},{"label":"Recovery","text":"Sleep, resting heart rate and HRV couldn't be read today."},{"label":"Activity","text":"No walk
