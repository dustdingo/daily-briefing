*{box-sizing:border-box}

h preproduction","text":"Due tomorrow for Tuesday's filming, which still overlaps the A+B shoot."},{"title":"Draft the 2027 SPS schedule and goals","text":"On Today since Oct 7, and SPS has 0h logged this week. This morning's optional block is the best window left."},{"title":"Grade Blog Post #2","text":"Overdue since Friday. Clearing it Monday keeps the five Oct 30 grading items from stacking up."},{"title":"Send the American Integrity and mule invoices","text":"Billing has waited since Oct 11. Monday night is the admin and freelance block."}],"opportunities":[{"role":"SPS","title":"Module 6 Case Study script","text":"With the Oct 13 portrait segment shot, scripting it would finish Storyteller 101's core lessons."},{"role":"Speaking","title":"Church Production Article","text":"The quotes you pull today could double as SPS teaching examples on storytelling in church media."},{"role":"Teaching","title":"Batch the Moody videos","text":"Record the Week 10 intro (due Sunday) and film the Week 2 announcement (due Monday) back to back."}],"projectCards":[{"role":"SPS","level":"High","why":"Status: Modules 0-5 and both bonus lessons are done; Module 6 Case Study is next. 0h logged this week after 10h last week.","best":"Today's move: draft the 2027 SPS schedule and three goals. Morning block: Saturday's optional 7 to 9 AM slot (no weekday 5:30 block today); save 15 minutes to log the Oct 13 shoot in project_status.md.","watch":"projects.md still says to film the portrait segment on Oct 13. It looks stale, so update it once the shoot is logged."},{"role":"Speaking","level":"High","why":"Interview quotes due today, outline Sunday, draft Wednesday, fact-check Thursday. Respond to Tim with SALT is due Tuesday.","best":"Pull the quotes 1:00 to 2:15 PM, before the shoot.","watch":"Sunday morning is booked, so the outline needs Sunday afternoon or Monday."},{"role":"Freelance","level":"High","why":"Awaken Church prep is due tomorrow for Tuesday's 12 to 2 PM filming, which overlaps the A+B Video Shoot.","best":"Prep 9 to 11 AM. American Integrity on Today: EDIT 05 Why Become Appointed - National, EDIT 15 Albert Ortiz, EDIT 16 Alexandra Rodriguez, EDIT 27 Wayne Dennis, EDIT 28 Zach Smith.","watch":"Things has EDIT 17 Amika Powell and EDIT 18 Anastasia Johnson on Today, but the tracker lists both as Awaiting Review. Billing is still open."},{"role":"Teaching","level":"High","why":"GRADE Blog Post #2 is overdue, and the Week 10 intro and Discussion 1 response are due Sunday.","best":"Record the Week 10 intro Sunday afternoon and grade Blog Post #2 Monday night.","watch":"Five grading items land Oct 30, and Wednesday's teaching night is taken by MDWK and the Sonic concert."},{"role":"Seacoast","level":"Medium","why":"Connect young adult story shoot today, 3 to 8 PM in Mount Pleasant.","best":"Pack the gear by 2:15 PM and plan for gusty wind outdoors.","watch":"Thursday's MCC b-roll shoot runs 6 to 8:30 PM, into family time."}]},"reading":{"devotional":{"series":"My Utmost for His Highest","date":"Oct 24","title":"THE PROPER PERSPECTIVE","reference":"2 Corinthians 2:14","summary":["Keep God's perspective every day: we are captives in Christ's triumphal procession, and the victory is always His."],"fullText":["“Thanks be to God who always leads us in triumph in Christ . . . .”","The proper perspective of a servant of God must not simply be as near to the highest as he can get, but it must be the highest. Be careful that you vigorously maintain God’s perspective, and remember that it must be done every day, little by little. Don’t think on a finite level. No outside power can touch the proper perspective.","The proper perspective to maintain is that we are here for only one purpose—to be captives marching in the procession of Christ’s triumphs. We are not on display in God’s showcase—we are here to exhibit only one thing—the “captivity [of our lives] to the obedience of Christ” (2 Corinthians 10:5). How small all the other perspectives are! For example, the ones that say, “I am standing all alone, battling for Jesus,” or, “I have to maintain the cause of Christ and hold down this fort for Him.” But Paul said, in essence, “I am in the procession of a conqueror, and it doesn’t matter what the difficulties are, for I am always led in triumph.” Is this idea being worked out practically in us? Paul’s secret joy was that God took him as a blatant rebel against Jesus Christ, and made him a captive—and that became his purpose. It was Paul’s joy to be a captive of the Lord, and he had no other interest in heaven or on earth. It is a shameful thing for a Christian to talk about getting the victory. We should belong so completely to the Victor that it is always His victory, and “we are more than conquerors through Him . . .” (Romans 8:37).","“We are to God the fragrance of Christ . . .” (2 Corinthians 2:15). We are encompassed with the sweet aroma of Jesus, and wherever we go we are a wonderful refreshment to God."]},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Oct 24","title":"","summary":"","paragraphs":["If you walk into any public building, you’ll see a glass panel on the wall containing a fire extinguisher etched with the words “break glass in case of fire.” Although fires are incredibly rare, having a fire extinguisher handy when one breaks out can make all the difference between a minor blaze and a roaring, five-alarm event. Planning for that contingency, even though it might never happen, is important and maybe even critical.","In a similar way, there are many “fires” that break out in our lives and work. Maybe it’s a client emergency that’s going to require you to work late hours or all weekend. Maybe it’s someone on your team getting sick or suddenly quitting, leaving everyone else to pick up the slack. It’s inevitable that at some point, there is going to be a fire that needs to be extinguished. Do you have a “break the glass” strategy?","We often react in these moments rather than responding, and the reason is that we haven’t developed a plan for what to do when they arise. (They inevitably will.) So what are the fires that are most likely to arise over the coming weeks? Do you have a plan for how to resource putting them out, how to fund your effort if necessary, and how to communicate with others about the situation? Don’t react. Make a plan to respond.","Develop a “break the glass” strategy so that you are able to respond in moments of crisis rather than reacting."],"question":"What contingency should you be planning for, just in case?"}},"fitness":{"eyebrow":"Tomorrow · Sunday · Rest day","stats":[{"value":"226.8","label":"lb weekly avg (Oct 19-22)"},{"value":"0.7","label":"lb/wk actual (3 wks)"},{"value":"1.3","label":"lb/wk needed"},{"value":"22","label":"weeks to goal"}],"progress":[{"label":"Weight","text":"226.8 lb avg this week (4 weigh-ins), losing about 0.7 lb/wk since 228.9 the week of Sep 28. Goal of 199 lb by Mar 28 (last read from goals) needs 1.3 lb/wk; sustainable range 1.1-2.3 lb/wk. Progress has slowed below 0.5% a week."},{"label":"Nutrition","text":"No meals in Wellness after Oct 10 and no MyFitnessPal export since Oct 5, so there's nothing to average for the last 7 days."},{"label":"Strength","text":"Not available this morning (Wellness daily limit)."},{"label":"Recovery","text":"Sleep, RHR and HRV not available this morning (Wellness daily limit)."},{"label":"Activity","text":"Steps and walks not available this morning (Wellness daily limit)."}],"closing":"The scale is still moving, just slower than the goal needs. Getting food data flowing again (MyFitnessPal export or Apple Health) is the first fix, since you can't tune intake you can't see.","goals":[],"goalsNote":"Weekly tally unavailable: Wellne
