g as chance. God by His providence brings you into circumstances that you can’t understand at all, but the Spirit of God understands. God brings you to places, among people, and into certain conditions to accomplish a definite purpose through the intercession of the Spirit in you. Never put yourself in front of your circumstances and say, “I’m going to be my own providence here; I will watch this closely, or protect myself from that.” All your circumstances are in the hand of God, and therefore you don’t ever have to think they are unnatural or unique. Your part in intercessory prayer is not to agonize over how to intercede, but to use the everyday circumstances and people God puts around you by His providence to bring them before His throne, and to allow the Spirit in you the opportunity to intercede for them. In this way God is going to touch the whole world with His saints.","Am I making the Holy Spirit’s work difficult by being vague and unsure, or by trying to do His work for Him? I must do the human side of intercession—utilizing the circumstances in which I find myself and the people who surround me. I must keep my conscious life as a sacred place for the Holy Spirit. Then as I lift different ones to God through prayer, the Holy Spirit intercedes for them.","Your intercessions can never be mine, and my intercessions can never be yours, “. . . but the Spirit Himself makes intercession” in each of our lives (Romans 8:26). And without that intercession, the lives of others would be left in poverty and in ruin."]},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Phillip - Reconciliation with his Sisters","Eliana Gale - Dropped Class","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Nov 7","title":"","summary":"","paragraphs":["I once asked world-famous DJ Z-Trip how he discovered his voice as an artist, and he used the analogy of a tree. He said that when he began his career, he—like everyone else—was climbing the trunk of the tree because it is the safest and most stable part. However, as he began to progress in his career, he began to step out onto branches that took him farther away from the trunk, or what was expected. His DJ peers wondered what he was doing, because he was taking risks with his work that separated him from the pack and could result in failure or rejection by the industry. However, Z-Trip said that as he began to venture out onto new branches, he became so unique from other DJs that he began to carve his own space in the market, defined by his own voice. People were coming to him for the unique thing that only he could do.","So much of the process of discovering the unique value you offer is in choosing to step out onto one branch at a time, separating yourself a little bit from the predictability and stability of the trunk. Over time, you define your own space until soon you are sitting all alone out at the end of a winding branch.","To develop a unique voice, you must venture away from security and what’s expected. However, it’s best to do it one small decision at a time."],"question":"Question: What “branch” can you step out onto to separate you from the pack?"}},"fitness":{"eyebrow":"Saturday · Rest day","stats":[{"value":"2,332","label":"kcal maintenance (TDEE)"},{"value":"141","label":"days to the 199 lb goal (Mar 28)"},{"value":"0","label":"days of steps/RHR/HRV synced since Oct 31"}],"progress":[{"label":"Weight","text":"Not readable today. Wellness's 3-call daily analysis limit was already used before this run, so weigh-ins could not be pulled."},{"label":"Nutrition","text":"Not readable today, and food logs were not reconciled: no new MyFitnessPal export email, and nothing downloaded since Oct 27."},{"label":"Strength","text":"Not readable today. Sessions synced overnight by the 3:45 AM task are in
