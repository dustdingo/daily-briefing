itle":"Rough-cut EDIT 20th 10 on Friday","text":"Danielle DeGain & Donna Gonzalez is due Dec 2, and Friday is open."}],"opportunities":[{"role":"SPS","title":"Use the trough","text":"Today's Daily Creative says troughs are for learning and looking ahead. SPS has been quiet since mid-October; planning 2027 today turns that quiet into a restart."},{"role":"Teaching","title":"Batch the videos","text":"Record the Week 15 intro and Week 7 announcement together Saturday and Sunday stays free."},{"role":"Freelance","title":"Get ahead on American Integrity","text":"EDIT 20th 10 is due Dec 2 and 20th 11 Dec 9. A Friday rough cut keeps December from stacking up."}],"projectCards":[{"role":"SPS","level":"High","why":"Status: stalled. No SPS time in Toggl since the week of Oct 12. The Things task to revisit the SPS schedule and 2027 goals is still on Today.","best":"Today's move: draft a weekly SPS rhythm you can actually keep and three 2027 goals, then add dated Storyteller 101 b-roll tasks in Things.","watch":"Morning block: 5:30-7:00 AM, no drop-off. project_status.md still says Module 5 is next while projects.md says Modules 0-5 are complete; update project_status.md."},{"role":"Teaching","level":"High","why":"Three grading tasks due Fri Nov 27, then the Discussion 6 response and Week 15 intro on Nov 29 and the Week 7 announcement on Nov 30.","best":"Grade all three before 10 AM; record both videos Saturday.","watch":"Five grading tasks due Fri Dec 4, plus new tasks: reach out to Jenna Johnson (Dec 4) and outline lectures (Dec 11)."},{"role":"Freelance","level":"Medium","why":"Thursday is a Freelance night, but it's Thanksgiving. 16h of ACEP logged Nov 22-23, nothing since.","best":"Leave it for Friday: rough-cut EDIT 20th 10 and check the Mayor Rainwater Top 10 (end of November).","watch":"American Integrity: nothing on Today. On deck: EDIT 20th 10 Danielle DeGain & Donna Gonzalez (Dec 2), then 11 Steve Biggs (Dec 9), 12 Dennis Gagnon (Dec 14), 13 Donna Ritchie (Dec 16), 14 Toni Logan (Dec 23)."},{"role":"Seacoast","level":"Medium","why":"Offices closed today. No Seacoast time logged this week.","best":"Add a Things task for NYE Service V1 (due Dec 1) and block Monday for it.","watch":"Monday: Weekend Debrief at 9 and Film Team Weekly at 10:30."},{"role":"Personal","level":"Medium","why":"Thanksgiving today, Lindsey Stirling Saturday at 7 PM.","best":"Be present today; work ends at 10 AM.","watch":"Ameriprise meeting Tue Dec 1 at 10:30 AM and Zelda's violin lesson at 3:45."},{"role":"Speaking","level":"Low","why":"Nothing due this week.","best":"START CONVERSATION with Taylor and Chris, both due Dec 14.","watch":"SALT Advisory Team Info Meeting, Thu Dec 3 at 4:30 PM."}]},"reading":{"devotional":{"series":"My Utmost for His Highest","date":"Nov 26","title":"THE FOCAL POINT OF SPIRITUAL POWER","reference":"Galatians 6:14","fullText":["“. . . except in the cross of our Lord Jesus Christ . . . .”","If you want to know the power of God (that is, the resurrection life of Jesus) in your human flesh, you must dwell on the tragedy of God. Break away from your personal concern over your own spiritual condition, and with a completely open spirit consider the tragedy of God. Instantly the power of God will be in you. “Look to Me . . .” (Isaiah 45:22). Pay attention to the external Source and the internal power will be there. We lose power because we don’t focus on the right thing. The effect of the Cross is salvation, sanctification, healing, etc., but we are not to preach any of these. We are to preach “Jesus Christ and Him crucified” (1 Corinthians 2:2). The proclaiming of Jesus will do its own work. Concentrate on God’s focal point in your preaching, and even if your listeners seem to pay it no attention, they will never be the same again. If I share my own words, they are of no more importance than your words are to me. But if we share the truth of God with one another, we will encounter it again and again. We have to focus on the great point of spiritual power—the Cross. If we stay in contact with that center of power, its energy is released in our lives. In holiness movements and spiritual experience meetings, the focus tends to be put not on the Cross of Christ but on the effects of the Cross.","The feebleness of the church is being criticized today, and the criticism is justified. One reason for the feebleness is that there has not been this focus on the true center of spiritual power. We have not dwelt enough on the tragedy of Calvary or on the meaning of redemption."],"summary":["Spiritual power comes from focusing on the Cross itself, not on its effects. Preach Jesus Christ and Him crucified and the power of God is released."]},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Phillip - Reconciliation with his Sisters","Eliana Gale - Dropped Class","Josie - Brother’s Faith, workplace relationship","Joseph - Rejection and a busy semester","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Nov 26","title":"","summary":"","paragraphs":["At times, it seems like you are on fire, have plenty of energy, and could go on at your current pace forever. Then you inexplicably hit a wall, and your output suddenly changes. You are in a trough with no clear explanation why.","When you have high expectations, it’s tempting to believe that the solution to consistently impressive productivity is to remove the troughs so that you have no “off” moments. However, by removing the troughs, you also inadvertently limit the peaks. You force yourself into a very narrow bandwidth of productivity that is predictable but also stale.","To be effective, you must embrace the rhythmic nature of the creative process. The peaks are inexplicably linked to the troughs. There must be downtime to accompany your frenetic uptime. Every hill you climb means an eventual valley to endure.","The key is to not resent the troughs but to instead recognize them as seasons when your creative process has gone underground for a while. Use those trough moments to learn, to look for new opportunities, and to rest.","The creative process has peaks and troughs. Instead of resenting the troughs, learn from them and leverage them to look for new opportunities."],"question":"Are you in a creative peak or trough right now? What does that mean for you?"}},"fitness":{"eyebrow":"Thursday · Off Day Circuit","stats":[{"value":"227.4","label":"lb, Nov 12 weigh-in"},{"value":"2,164","label":"avg kcal, 3 full days Nov 19-21"},{"value":"133","label":"avg protein g, same days"},{"value":"6.6","label":"avg sleep h, 4 nights"}],"progress":[{"label":"Weight","text":"No weigh-in since 227.4 lb on Nov 12, 14 days ago, so no weekly average. Goal 199 by Mar 28 needs about 1.6 lb/wk, inside the sustainable 1.1-2.3 lb/wk."},{"label":"Nutrition","text":"Last 7 days: three full days (Nov 19, 20, 21), averaging 2,164 kcal (target 2,308) and 133g protein (target 200). No day hit 180g. Nothing logged Nov 22 through 25."},{"label":"Strength","text":"No strength sessions logged since Nov 13 (Back & Triceps). Chest last trained Nov 2, legs Oct 9. Row has held at 90 lb x10 for three sessions; close grip bench struggled Oct 30 and Nov 13."},{"label":"Recovery","text":"6.6h average over 4 recorded nights (Nov 21, 22, 24, 25); Tuesday night was 7.5h, the best of the week. Wednesday HRV 37 vs a 40 average and RHR 62, both normal. Recovery read: normal."},{"label":"Activity","text":"About 3,700 steps a day Nov 20-25 and about 3,500 this week. No Watch walks since 1.3 mi on Nov 20."}],"closing":"Recovery is fine, so do the circuit this morning and get a walk in after dinner. Step on the scale before breakfast and log the Thanksgiving plate; protein is still the gap at 133g vs 200g.","goals":[{"name":"Strength sessions","done":0,"total":3},{"name":"Off Day ci
