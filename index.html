t steps on the calendar.","watch":"Morning block: 5:30-7:15 AM, full window before drop-off. project_status.md is stale (Sep 28); projects.md is current."},{"role":"Teaching","level":"Critical","why":"Newspaper #2 is a week overdue and five grading tasks are due today.","best":"Newspaper #2 today; the rest over the weekend if family night holds.","watch":"Discussion 4 response and Week 13 intro due Sun Nov 15; four more grading tasks Nov 20."},{"role":"Speaking","level":"High","why":"Foundations speaker proposals slipped a day; faculty names to Kristen are due today.","best":"Send both before the 11:30 Track Leader Connect.","watch":"Follow up RE: Article 2 and the two archive tasks are still on Today."},{"role":"Freelance","level":"High","why":"Preproduction is two days overdue. The Awaken Church story airs Sun Nov 15.","best":"Saturday morning block if you open one; otherwise Monday night.","watch":"American Integrity: Today in Things is EDIT 16 Alexandra Rodriguez (tracker: awaiting client feedback). Next 20th anniversary edit is Dick Dowd, Nov 25."},{"role":"Seacoast","level":"Medium","why":"First day back after four days out.","best":"Use the morning to catch up before the FILO call.","watch":"Mon Nov 16: Weekend Debrief, Christmas Decor, Film Team Weekly. Christmagiving Tue. NYE Service V1 due Thu Nov 19."}]},"reading":{"devotional":{"series":"My Utmost for His Highest","date":"Nov 13","title":"FAITH OR EXPERIENCE?","reference":"Galatians 2:20","summary":["Push past moods and feelings into full devotion to Jesus, not to our own experiences of Him.","Faith rests on who the New Testament says Christ is, and a life built on that should sound like praise, not fear."],"fullText":["“. . . the Son of God, who loved me and gave Himself for me.”","We should battle through our moods, feelings, and emotions into absolute devotion to the Lord Jesus. We must break out of our own little world of experience into abandoned devotion to Him. Think who the New Testament says Jesus Christ is, and then think of the despicable meagerness of the miserable faith we exhibit by saying, “I haven’t had this experience or that experience”! Think what faith in Jesus Christ claims and provides—He can present us faultless before the throne of God, inexpressibly pure, absolutely righteous, and profoundly justified. Stand in absolute adoring faith “in Christ Jesus, who became for us wisdom from God—and righteousness and sanctification and redemption . . .” (1 Corinthians 1:30). How dare we talk of making a sacrifice for the Son of God! We are saved from hell and total destruction, and then we talk about making sacrifices!","We must continually focus and firmly place our faith in Jesus Christ—not a “prayer meeting” Jesus Christ, or a “book” Jesus Christ, but the New Testament Jesus Christ, who is God Incarnate, and who ought to strike us dead at His feet. Our faith must be in the One from whom our salvation springs. Jesus Christ wants our absolute, unrestrained devotion to Himself. We can never experience Jesus Christ, or selfishly bind Him in the confines of our own hearts. Our faith must be built on strong determined confidence in Him.","It is because of our trusting in experience that we see the steadfast impatience of the Holy Spirit against unbelief. All of our fears are sinful, and we create our own fears by refusing to nourish ourselves in our faith. How can anyone who is identified with Jesus Christ suffer from doubt or fear! Our lives should be an absolute hymn of praise resulting from perfect, irrepressible, triumphant belief."]},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Phillip - Reconciliation with his Sisters","Eliana Gale - Dropped Class","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Nov 13","title":"","summary":"","paragraphs":["“Don’t apologize for your existence.”","This is a phrase I coined to help people on my team stop apologizing for sharing a bold point of view. I noticed that a lot of creative pros—myself included—struggle with “sorry under my breath” syndrome, or the need to apologize any time they express an opinion. I think it connects to the deep insecurity that many creatives feel about whether their work is truly good and the subsequent fear that they will never measure up to expectations. So “sorry” becomes shorthand for “I really shouldn’t be speaking right now.”","But…you should.","We need a diverse set of perspectives in order to get to the right idea. We need one another in order to see things clearly. We need our peers to be willing to say what they see. And they need you to do the same.","Apologies are for when you’ve genuinely wronged someone. And when you do, please apologize loudly. But don’t follow the compulsion to apologize for sharing your perspective. It’s part of your job as a pro to do so, and apologizing for it means that you are devaluing yourself, the person listening to you, the person who hired you, and the very space that you’re occupying.","Don’t apologize for your existence."],"question":"Question: Are you overly apologetic in certain situations? Why do you think that’s the case?"}},"fitness":{"eyebrow":"Friday · Legs & Shoulders","stats":[{"value":"227.4","label":"lb, Nov 12 weigh-in"},{"value":"2,154","label":"avg kcal, 5 full days Nov 7-12"},{"value":"131","label":"avg protein g, same days"},{"value":"7.3","label":"avg sleep h, last 6 nights"}],"progress":[{"label":"Weight","text":"One weigh-in this week: 227.4 lb on Nov 12, above the 224.7 lb average for Nov 2-8. Single readings swing 1-3 lb, so wait for more weigh-ins before reading the trend. Goal is 199 by Mar 28."},{"label":"Nutrition","text":"Five full days (Nov 7-10, 12) averaged 2,154 kcal (target 2,308) and 131g protein (target 200). Only Nov 10 hit 180g+. Nov 6 and Nov 11 have only two meals logg
