andra Rodriguez are on Today.","watch":"Keep edits out of the SPS mornings."},{"role":"Speaking","level":"Medium","why":"Interview quotes due Thursday, and the SALT speaker scouting task is past due.","best":"Write down Foundations speaker names from SALT while they're fresh.","watch":"Ship the Phil Gauthier hat."},{"role":"Personal","level":"Low","why":"HHA Trunk or Treat Friday at 5 PM.","best":"Get home by 5 tonight for an hour with the family.","watch":"Friday is family night; nothing else goes on it."}]},"reading":{"devotional":{"series":"My Utmost for His Highest","date":"Oct 21","title":"IMPULSIVENESS OR DISCIPLESHIP?","reference":"Jude 20","summary":["Our Lord never acted on impulse; discipleship is built on the supernatural grace of God, not natural boldness.","The real test is being exceptional in ordinary, unnoticed days, which takes discipline, not crisis courage."],"fullText":["“But you, beloved, building yourselves up on your most holy faith . . . .”","There was nothing of the nature of impulsive or thoughtless action about our Lord, but only a calm strength that never got into a panic. Most of us develop our Christianity along the lines of our own nature, not along the lines of God’s nature. Impulsiveness is a trait of the natural life, and our Lord always ignores it, because it hinders the development of the life of a disciple. Watch how the Spirit of God gives a sense of restraint to impulsiveness, suddenly bringing us a feeling of self-conscious foolishness, which makes us instantly want to vindicate ourselves. Impulsiveness is all right in a child, but is disastrous in a man or woman—an impulsive adult is always a spoiled person. Impulsiveness needs to be trained into intuition through discipline.","Discipleship is built entirely on the supernatural grace of God. Walking on water is easy to someone with impulsive boldness, but walking on dry land as a disciple of Jesus Christ is something altogether different. Peter walked on the water to go to Jesus, but he “followed Him at a distance” on dry land (Mark 14:54). We do not need the grace of God to withstand crises—human nature and pride are sufficient for us to face the stress and strain magnificently. But it does require the supernatural grace of God to live twenty-four hours of every day as a saint, going through drudgery, and living an ordinary, unnoticed, and ignored existence as a disciple of Jesus. It is ingrained in us that we have to do exceptional things for God—but we do not. We have to be exceptional in the ordinary things of life, and holy on the ordinary streets, among ordinary people—and this is not learned in five minutes."]},"prayer":["Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Oct 21","title":"","summary":"","paragraphs":["Creative work is subjective. You can labor for weeks on a project and deliver something that you fully believe in only to have it rejected by the stakeholders for some nebulous, maybe even undefined, reason. In those moments, it’s easy to take the rejection personally and feel it deeply. After all, it was your idea, your execution, your risk. It stings, and rightly so.","While it’s perfectly fine to feel the pain of rejection when it occurs, it’s important to be mindful of what happens next. Sometimes that moment of rejection can morph into a season of feeling like a reject. The temporary moment of rejection turns into a nametag bearing the name “Reject,” and you begin to wonder if you’ve lost a step and if you’ll ever be as good as you once were.","A rejection of your work is not a rejection of your worth. Yes, it’s natural to feel the sting when your work isn’t chosen, but that is not a statement about the value that you inherently carry as a human being, nor is it a statement about your capabilities as a creative pro. It’s a statement about one moment in time, with one proj
