"Mayor Rainwater Top 10 is due end of November, and no ACEP time has been logged since Monday's 7.2h.","best":"Rough cut this afternoon.","watch":"American Integrity: nothing on Today. On deck: EDIT 20th 10 Danielle DeGain & Donna Gonzalez (Dec 2), then 11 Steve Biggs (Dec 9), 12 Dennis Gagnon (Dec 14), 13 Donna Ritchie (Dec 16), 14 Toni Logan (Dec 23)."},{"role":"Seacoast","level":"Medium","why":"No meetings today, offices closed Thursday, and no Seacoast time logged Monday or Tuesday.","best":"Add a Things task for NYE Service V1 (due Dec 1) and block time Monday.","watch":"Monday has the Weekend Debrief at 9 and Film Team Weekly at 10:30."},{"role":"Personal","level":"Medium","why":"MDWK tonight, Thanksgiving tomorrow, Lindsey Stirling Saturday.","best":"Pack dinner for MDWK and leave early for the rain.","watch":"Ameriprise meeting Tue Dec 1 at 10:30 AM."},{"role":"Speaking","level":"Low","why":"Nothing due this week.","best":"START CONVERSATION with Taylor and Chris, both due Dec 14.","watch":"SALT Advisory Team Info Meeting, Thu Dec 3 at 4:30 PM."}]},"reading":{"devotional":{"series":"My Utmost for His Highest","date":"Nov 25","title":"THE SECRET OF SPIRITUAL CONSISTENCY","reference":"Galatians 6:14","summary":["Spiritual consistency comes from being rooted in the Cross of Christ, not from steady outward circumstances. Restate your beliefs and rebuild them on the Cross; preaching the Cross releases the power of God."],"fullText":["“God forbid that I should boast except in the cross of our Lord Jesus Christ . . . .”","When a person is newly born again, he seems inconsistent due to his unrelated emotions and the state of the external things or circumstances in his life. The apostle Paul had a strong and steady underlying consistency in his life. Consequently, he could let his external life change without internal distress because he was rooted and grounded in God. Most of us are not consistent spiritually because we are more concerned about being consistent externally. In the external expression of things, Paul lived in the basement, while his critics lived on the upper level. And these two levels do not begin to touch each other. But Paul’s consistency was down deep in the fundamentals. The great basis of his consistency was the agony of God in the redemption of the world, namely, the Cross of Christ.","State your beliefs to yourself again. Get back to the foundation of the Cross of Christ, doing away with any belief not based on it. In secular history the Cross is an infinitesimally small thing, but from the biblical perspective it is of more importance than all the empires of the world. If we get away from dwelling on the tragedy of God on the Cross in our preaching, our preaching produces nothing. It will not transmit the energy of God to man; it may be interesting, but it will have no power. However, when we preach the Cross, the energy of God is released. “. . . it pleased God through the foolishness of the message preached to save those who believe. . . . we preach Christ crucified . . .” (1 Corinthians 1:21, 23)."]},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Phillip - Reconciliation with his Sisters","Eliana Gale - Dropped Class","Josie - Brother’s Faith, workplace relationship","Joseph - Rejection and a busy semester","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Nov 25","title":"","summary":"","paragraphs":["The worddisciplineis polarizing. To some, it implies the grind. It means sweat, grit, blood, and sacrifice. To others, it sounds like obligation. It’s something I ought to do but probably don’t want to. It’s guilt inducing.","I’d like to simplify the word for all of us. Discipline simply means to make an agreement with yourself, a promise to yourself, and then keep it.","If you agree that you’re going to run for two minutes and you do it, you are disciplined. You did what you said you would. You don’t have to run a 5K; you just do what you say.","If you say you’re going to write fifty words a day, or two hundred, or a thousand and you do it, you are disciplined.","We get into problems when we make promises that we can’t or don’t intend to keep. We say, “I’m going to write twenty-five hundred words on Tuesday,” then something comes up and we only write a few hundred, and we feel terrible and undisciplined. The reality is that we set unrealistic expectations.","To be disciplined, set realistic expectations of yourself, then deliver on them. Always do what you say.","Discipline simply means to make an agreement with yourself, then keep it. Don’t make agreements you don’t intend to do everything you can to keep."],"question":"What agreements do you have with yourself right now? What does discipline look like in your life?"}},"fitness":{"eyebrow":"Wednesday · Back & Triceps","stats":[{"value":"227.4","label":"lb, Nov 12 weigh-in"},{"value":"2,164","label":"avg kcal, 3 full days Nov 19-21"},{"value":"133","label":"avg protein g, same days"},{"value":"6.4","label":"avg sleep h, 4 nights"}],"progress":[{"label":"Weight","text":"No weigh-in since 227.4 lb on Nov 12, 13 days ago, so no weekly average. Goal 199 by Mar 28 needs about 1.6 lb/wk, inside the sustainable 1.1-2.3 lb/wk."},{"label":"Nutrition","text":"Last 7 days: three full days (Nov 19, 20, 21), averaging 2,164 kcal (target 2,308) and 133g protein (target 200). No day hit 180g. Nov 18 has breakfast only, and nothing was logged Nov 22, 23 or 24."},{"label":"Strength","text":"No strength sessions logged since Nov 13 (Back & Triceps). Chest last trained Nov 2 and legs Oct 9. Row has held at 90 lb x10 for three sessions; close grip bench struggled Oct 30 and Nov 13."},{"label":"Recovery","text":"6.4h average over 4 recorded nights (Nov 19, 21, 22, 24), three of them under 6.5h. Tuesday HRV 33 vs a 40 average (17% low) w
