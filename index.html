},{"role":"Seacoast","level":"Medium","why":"A+B shoot today; Creative Lunch Wednesday; MCC b-roll Thursday evening.","best":"Write the devotional and follow up with campus pastors before the shoot.","watch":"Follow Up with Campus Pastors has sat on Today since Aug 19."}]},"reading":{"devotional":{"series":"My Utmost for His Highest","date":"Oct 27","title":"THE METHOD OF MISSIONS","reference":"Matthew 28:19","summary":["Jesus said to make disciples, not to save souls, and only a disciple can make disciples.","The real challenge is not other people but whether I trust what my risen Lord has said."],"fullText":["“Go therefore and make disciples of all the nations . . . .”","Jesus Christ did not say, “Go and save souls” (the salvation of souls is the supernatural work of God), but He said, “Go . . . make disciples of all the nations . . . .” Yet you cannot make disciples unless you are a disciple yourself. When the disciples returned from their first mission, they were filled with joy because even the demons were subject to them. But Jesus said, in effect, “Don’t rejoice in successful service—the great secret of joy is that you have the right relationship with Me” (see Luke 10:17–20). The missionary’s great essential is remaining true to the call of God, and realizing that his one and only purpose is to disciple men and women to Jesus. Remember that there is a passion for souls that does not come from God, but from our desire to make converts to our point of view.","The challenge to the missionary does not come from the fact that people are difficult to bring to salvation, that backsliders are difficult to reclaim, or that there is a barrier of callous indifference. No, the challenge comes from the perspective of the missionary’s own personal relationship with Jesus Christ—“Do you believe that I am able to do this?” (Matthew 9:28). Our Lord unwaveringly asks us that question, and it confronts us in every individual situation we encounter. The one great challenge to us is—do I know my risen Lord? Do I know the power of His indwelling Spirit? Am I wise enough in God’s sight, but foolish enough according to the wisdom of the world, to trust in what Jesus Christ has said? Or am I abandoning the great supernatural position of limitless confidence in Christ Jesus, which is really God’s only call for a missionary? If I follow any other method, I depart altogether from the methods prescribed by our Lord—“All authority has been given to Me. . . Go therefore . . .” (Matthew 28:18–19)."]},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Oct 27","title":"","summary":"","paragraphs":["There are few things that affect your creative process more than the quality of the stimuli that you allow to enter your mind. The better and more diverse “dots” you have to connect, the higher quality ideas you are likely to generate. But some people leave their raw creative inputs to chance. They read whatever comes across their field of view or spend time mindlessly surfing the web, Instagram, or Twitter for something that sparks their interest.","As a pro, you can’t afford to leave your stimulus to chance. I recommend that you have what I call a “stimulus queue.” It’s a list of items that you plan to read, experience, and watch next. You might use a tool (there are any number of apps that allow you to aggregate articles from the web) or the back page of your notebook or simply keep a stack of books next to your desk. (That’s what I do, and mine is growing tall!) But the key is that you file away interesting stimuli and work through them in a processed way.","Don’t leave your stimulus to chance. Keep a stimulus queue or list of things you want to experience, read, or watch, and work through it over time."],"question"
