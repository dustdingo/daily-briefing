mself? Allow Him to drive His question home to you—“Do you believe this? ” Are you facing an area of doubt in your life? Have you come, like Martha, to a crossroads of overwhelming circumstances where your theology is about to become a very personal belief? This happens only when a personal problem brings the awareness of our personal need.","To believe is to commit. In the area of intellectual learning I commit myself mentally, and reject anything not related to that belief. In the realm of personal belief I commit myself morally to my convictions and refuse to compromise. But in intimate personal belief I commit myself spiritually to Jesus Christ and make a determination to be dominated by Him alone.","Then, when I stand face to face with Jesus Christ and He says to me, “Do you believe this?” I find that faith is as natural as breathing. And I am staggered when I think how foolish I have been in not trusting Him earlier."]},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Phillip - Reconciliation with his Sisters","Eliana Gale - Dropped Class","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Nov 6","title":"","summary":"","paragraphs":["How do you know which of your ideas is ready to put into the world? Phil Libin, founder and former CEO of Evernote, believes that the best ideas are ones that technology has just made possible for the first time in history but that are still difficult to achieve. Difficulty means that many won’t try them, but the fact that it’s possible for the first time means that you can step into a space that others haven’t yet considered. The convergence ofjust became possibleandstill kind of difficultis the place where tremendous, unexpected value can be created.","Are you working on anything that meets that description? Maybe there’s an idea that you’ve been exploring, but it doesn’t quite seem like it’s ready for prime time. How can you alter the idea so that you’re doing something that’s only recently possible and still really difficult to do? By concentrating your efforts on these sorts of ideas, you are likely to uncover value that others haven’t. And you may even surprise yourself with what you accomplish.","The biggest value in your work lies at the intersection of things that just became possible and things that are still difficult to accomplish."],"question":"As you consider your work, which ideas lie at the intersection of these two dynamics?"}},"trips":[]}</script>
