ger I who live, but Christ lives in me . . . .”","These words mean the breaking and collapse of my independence brought about by my own hands, and the surrendering of my life to the supremacy of the Lord Jesus. No one can do this for me, I must do it myself. God may bring me up to this point three hundred and sixty-five times a year, but He cannot push me through it. It means breaking the hard outer layer of my individual independence from God, and the liberating of myself and my nature into oneness with Him; not following my own ideas, but choosing absolute loyalty to Jesus. Once I am at that point, there is no possibility of misunderstanding. Very few of us know anything about loyalty to Christ or understand what He meant when He said, “ . . . for My sake ” (Matthew 5:11). That is what makes a strong saint.","Has that breaking of my independence come? All the rest is religious fraud. The one point to decide is—will I give up? Will I surrender to Jesus Christ, placing no conditions whatsoever as to how the brokenness will come? I must be broken from my own understanding of myself. When I reach that point, immediately the reality of the supernatural identification with Jesus Christ takes place. And the witness of the Spirit of God is unmistakable—“I have been crucified with Christ . . . .”","The passion of Christianity comes from deliberately signing away my own rights and becoming a bondservant of Jesus Christ. Until I do that, I will not begin to be a saint.","One student a year who hears God’s call would be sufficient for God to have called the Bible Training College into existence. This college has no value as an organization, not even academically. Its sole value for existence is for God to help Himself to lives. Will we allow Him to help Himself to us, or are we more concerned with our own ideas of what we are going to be?"]},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natal . Abnormal, deviant events were normalized over time, even though they were unacceptable. This happens in many organizations as well. Undesired behavior like missing deadlines, being late to meetings, snapping back with sarcastic comments, and the like become normalized parts of the culture to the point that no one even questions them. However, the long-term consequences of normalizing these behaviors can be significant, or even disastrous.","You can’t allow unacceptable behavior to become normalized, whether in yourself, your team, or the people you lead.","Normalization of deviance can quickly erode a culture and the collective creative process."],"question":"Do you see normalization of deviance playing out in your work? In your team’s culture? What can you do about it?"}},"fitness":{"eyebrow":"Tomorrow · Wednesday · Back & Triceps","stats":[{"value":"199","label":"lb goal by Mar 28"},{"value":"21","label":"weeks to goal"},{"value":"200","label":"g protein target"},{"value":"2,308","label":"kcal target"}],"progress":[{"label":"Weight","text":"Not readable today. Wellness hit its daily limit of 3 analysis calls, so weigh-ins couldn't be pulled."},{"label":"Nutrition","text":"Wellness has no meals logged from Oct 27 on, and no MyFitnessPal export has arrived since Oct 27. The last 7 days can't be judged."},{"label":"Strength","text":"Not readable today (same limit)."},{"label":"Recovery","text":"Sleep, RHR and HRV not readable today (same limit)."},{"label":"Activity","text":"Steps and walks not readable today (same limit)."}],"closing":"Food logging is the gap to fix first: get the MyFitnessPal export flowing again, then hit both shakes today and get the circuit done before the brunch.","goals":[],"goalsNote":"This week's tally couldn't be read (Wellness daily limit). Plan for the week: Day 1 was Monday, circuit today, Day 2 Wednesday, circuit Thursday, Day 3 Friday.","strengthNotes":["Exercise history couldn't be read today (Wellness daily limit).","Front raises:
