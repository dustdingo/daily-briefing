 Lord never insists on our obedience. He stresses very definitely what we ought to do, but He never forces us to do it. We have to obey Him out of a oneness of spirit with Him. That is why whenever our Lord talked about discipleship, He prefaced it with an “If,” meaning, “You do not need to do this unless you desire to do so.” “ If anyone desires to come after Me, let him deny himself . . .” (Luke 9:23). In other words, “To be My disciple, let him give up his right to himself to Me.” Our Lord is not talking about our eternal position, but about our being of value to Him in this life here and now. That is why He sounds so stern (see Luke 14:26). Never try to make sense from these words by separating them from the One who spoke them.","The Lord does not give me rules, but He makes His standard very clear. If my relationship to Him is that of love, I will do what He says without hesitation. If I hesitate, it is because I love someone I have placed in competition with Him, namely, myself. Jesus Christ will not force me to obey Him, but I must. And as soon as I obey Him, I fulfill my spiritual destiny. My personal life may be crowded with small, petty happenings, altogether insignificant. But if I obey Jesus Christ in the seemingly random circumstances of life, they become pinholes through which I see the face of God. Then, when I stand face to face with God, I will discover that through my obedience thousands were blessed. When God’s redemption brings a human soul to the point of obedience, it always produces. If I obey Jesus Christ, the redemption of God will flow through me to the lives of others, because behind the deed of obedience is the reality of Almighty God."]},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Phillip - Reconciliation with his Sisters","Eliana Gale - Dropped Class","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Nov 2","title":"","summary":"","paragraphs":["In her bookThe Creative Habit, choreographer Twyla Tharp shares a fascinating insight into the formation of habits. She wakes very early each morning and goes to her studio for a workout. On many mornings, she doesn’t really feel like going, but she does anyway. However, going to the studio isn’t the habit. The habit is hailing the cab that will take her to the studio. She says that once she hails the cab, she knows that the rest of the process will be on autopilot, but the hardest part is getting down to the curb to hail the cab. So that’s the habit she focuses on.","It’s far too easy to overcomplicate habits and rituals, but if you try, you can probably simplify many of your most valuable ones down to that very first trigger action. It’s the thing that gets you moving. For me, every time I write, I light a candle. Not just any candle: an Archipelago Havana Cigar scented candle. I go through several each year. It’s an important part of my writing habit because it sends a signal to my brain that it’s time to begin to write. Once I light it, I’m already on the way. And I only light that candle when I’m writing.","Trigger habits can you help you get moving on difficult creative work."],"question":"What trigger habits can you begin to instill in your life today?"}},"fitness":{"eyebrow":"Tomorrow · Tuesday · Off Day Circuit","stats":[{"value":"199","label":"lb goal by Mar 28"},{"value":"21","label":"weeks to goal"},{"value":"200","label":"g protein target"},{"value":"2,308","label":"kcal target"}],"progress":[{"label":"Weight","text":"Not readable today. Wellness hit its daily limit of 3 analysis calls, so weigh-ins couldn't be pulled."},{"label":"Nutrition","text":"Not readable today (same limit). Food logs also haven't been reconciled since the Oct 27 export."},{"label":"Strength","text":"Not readable today (same limit)."},{"label":"Recovery","text":"Sleep, RH
