kly review","text":"Tonight. Plan next week around Christmagiving, studio days and the Teaching deadlines."},{"title":"Close out today's Teaching items","text":"Discussion 4 and the Week 13 intro, if Saturday's session didn't finish them."},{"title":"Add dated Storyteller 101 tasks","text":"Put b-roll and edit steps on Monday through Thursday mornings to keep the January launch alive."},{"title":"Finish Preproduction","text":"Four days overdue. Give it Monday's evening block (Household/Admin/Freelance)."},{"title":"Grade the backlog","text":"Newspaper #2, Blog Post #5 and Newspaper #3 on Tuesday's Teaching night, before four more land Nov 20."}],"opportunities":[{"role":"SPS","title":"Today's Daily Creative as course content","text":"Experience versus naivete is a strong Storyteller 101 talking point. Note it for the edit."},{"role":"Teaching","title":"Batch your videos","text":"Week 5 announcement (Nov 16), Week 14 intro (Nov 22) and Week 6 announcement (Nov 23) can be recorded in one sitting."},{"role":"Personal","title":"Walk goal done","text":"3 of 3 walks this week. An easy walk today moves toward the stretch goal of 5."}],"projectCards":[{"role":"SPS","level":"High","why":"Status: Storyteller 101 main teaching is filmed; b-roll and editing are open for the January launch. No SPS time in Toggl since the week of Oct 12 and no SPS tasks in Things.","best":"Today's move: none, it's Sunday. In tonight's review, add dated b-roll and edit tasks and assign them to Mon-Thu mornings.","watch":"Morning block: no SPS block on Sundays. Monday 5:30-7:15 AM is the next one. project_status.md is stale (Sep 28) and projects.md still lists 'Revisit schedule and goals' for 2027 Planning."},{"role":"Teaching","level":"Critical","why":"Discussion 4 and the Week 13 intro are due today. Three grading tasks are overdue (oldest Nov 6).","best":"Confirm today's two are done; grading Tuesday night.","watch":"Week 5 announcement and Website Evaluation 2 roster due Mon Nov 16; four grading tasks due Nov 20."},{"role":"Freelance","level":"High","why":"Preproduction is four days overdue. The Awaken Church story airs today.","best":"Monday evening's Freelance/Admin block.","watch":"American Integrity: Today in Things is EDIT 16 Alexandra Rodriguez (tracker: awaiting client feedback). Next 20th anniversary edit is Dick Dowd, Nov 25."},{"role":"Seacoast","level":"Medium","why":"Nothing Seacoast today. Next week is heavy: Christmas Decor, Christmagiving, NYE Service V1 due Thursday.","best":"Rest. Map the week in tonight's review.","watch":"2027 Bumper Studio Days Nov 19-21 are unflagged."},{"role":"Speaking","level":"Low","why":"Only Archive Old Talks and Archive Talk remain, both undated.","best":"Leave them for a weeknight.","watch":"SALT Advisory Team Info Meeting, Thu Dec 3 at 4:30 PM."}]},"reading":{"devotional":{"series":"My Utmost for His Highest","date":"Nov 15","title":"“WHAT IS THAT TO YOU?”","reference":"John 21:21–22","summary":["Stop interfering with God's plan for other people. Keep your own relationship with God right, and His discernment will come through you to bless others."],"fullText":["“Peter . . . said to Jesus, ‘But Lord, what about this man?’ Jesus said to him, ‘. . . what is that to you? You follow Me.’ ”","One of the hardest lessons to learn comes from our stubborn refusal to refrain from interfering in other people’s lives. It takes a long time to realize the danger of being an amateur providence, that is, interfering with God’s plan for others. You see someone suffering and say, “He will not suffer, and I will make sure that he doesn’t.” You put your hand right in front of God’s permissive will to stop it, and then God says, “What is that to you?” Is there stagnation in your spiritual life? Don’t allow it to continue, but get into God’s presence and find out the reason for it. You will possibly find it is because you have been interfering in the life of another—proposing things you had no right to propose, or advising when you had no right to advise. When you do have to give advice to another person, God will advise through you with the direct understanding of His Spirit. Your part is to maintain the right relationship with God so that His discernment can come through you continually for the purpose of blessing someone else.","Most of us live only within the level of consciousness—consciously serving and consciously devoted to God. This shows immaturity and the fact that we’re not yet living the real Christian life. Maturity is produced in the life of a child of God on the unconscious level, until we become so totally surrendered to God that we are not even aware of being used by Him. When we are consciously aware of being used as broken bread and poured-out wine, we have yet another level to reach—a level where all awareness of ourselves and of what God is doing through us is completely eliminated. A saint is never consciously a saint—a saint is consciously dependent on God."]},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Phillip - Reconciliation with his Sisters","Eliana Gale - Dropped Class","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Nov 15","title":"","summary":"","paragraphs":["Inevitably, every creative pro reaches a moment when they begin to think that maybe they’ve lost their touch. What came so easily just a few years before feels more challenging, and what once would have felt intuitive now takes a while to understand.","It’s going to be OK.","One of the blessings of inexperience is naivete. You don’t know what you don’t know. Everything feels so intuitive and clear and black-and-white. As you gain experience, things begin to appear grayer. The curse of experience is that you know all the things that could go wrong because you’ve seen it all before. By the time the newcomer shouts “I love it!” you’ve already subconsciously concocted ten ways the idea could go off the rails.","You haven’t “lost it”; you’re just more nuanced in your thinking. You see things as they are—shades of gray. You realize that life is a probability set, not a clear-cut math equation. That is valuable. It doesn’t feel as good in the moment, but it’s far more valuable than wide-eyed optimism.","Experience brings wisdom, which brings the curse of knowing that life is a probability set, not a clear-cut math equation."],"question":"Have you ever felt like you’re “losing it”? Where have you seen your experience pan out when less-experienced pros thought a different direction to be best?"}},"fitness":{"eyebrow":"Tomorrow · Tuesday · Off Day Circuit","stats":[{"value":"227.4","label":"lb, Nov 12 weigh-in"},{"value":"2,277","label":"avg kcal, 6 full days Nov 8-14"},{"value":"145","label":"avg protein g, same days"},{"value":"7.0","label":"avg sleep h, 6 nights"}],"progress":[{"label":"Weight","text":"One weigh-in this week: 227.4 lb on Nov 12, above the 224.7 lb average for Nov 2-8. One reading can swing 1-3 lb, so log a few weigh-ins this week before judging the trend. Goal is 199 by Mar 28."},{"label":"Nutrition","text":"Six days with 3+ meals logged (Nov 8-10, 12-14) averaged 2,277 kcal (target 2,308) and 145g protein (target 200). Only Nov 10 and Nov 13 hit 180g. Nov 11 has two meals logged; Nov 14 has no snack and Apple Health shows 670 kcal more than MyFitnessPal."},{"label":"Strength","text":"One session this week: Back & Triceps Nov 13. Row held at 90 lb x10, close grip bench marked struggled again. Chest last trained Nov 2, legs last logged Oct 9."},{"label":"Recovery","text":"7.0h average over 6 nights, two short (6.3h Nov 10 and Nov 13). Yesterday RHR 65 is normal; HRV 37 is about 13% under the week, near the take-it-easy line. A rest day fits. Last night isn't in yet."},{"label":"Activity","text":"About 5,900 steps a day Nov 9-14, 9,700 yesterday. Three 2.2 m
