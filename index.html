*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

"Seacoast","level":"Medium","why":"Not a Saturday task. Flagging for the week.","best":"Monday: Missions pastor outreach and Video 3 outline for the Oct 13 shoot.","watch":"ARC Gather fills Tuesday 9–4, and Wednesday is the live recording until 8:30 PM."},{"role":"Personal","level":"Low","why":"Two small tasks have been rolling on Today for weeks.","best":"Send the scheduling email for the Money Review with Rich Young (on the list since June).","watch":"Fix Home Assistant Missing Devices can wait. Smart Home is on hold."}]},"reading":{"devotional":{"series":"My Utmost for His Highest","date":"Oct 3","title":"The Place of Ministry","reference":"Mark 9:29","summary":["The disciples couldn't cast it out because they leaned on their own ideas about serving, not on knowing Jesus. The remedy is concentrating on Him, again and again.","Clear away whatever sits between you and Him by facing it, not skipping past it.","The saint's power shows in coming down from the mountaintop and living in the valley."],"fullText":["“He said to them, ‘This kind [of unclean spirit] can come out by nothing but prayer and fasting.’”","His disciples asked Him privately, ‘Why could we not cast it out?’” (9:28). The answer lies in a personal relationship with Jesus Christ. “This kind can come out by nothing but” concentrating on Him, and then doubling and redoubling that concentration on Him. We can remain powerless forever, as the disciples were in this situation, by trying to do God’s work without concentrating on His power, and by following instead the ideas that we draw from our own nature. We actually slander and dishonor God by our very eagerness to serve Him without knowing Him.","When you are brought face to face with a difficult situation and nothing happens externally, you can still know that freedom and release will be given because of your continued concentration on Jesus Christ. Your duty in service and ministry is to see that there is nothing between Jesus and yourself. Is there anything between you and Jesus even now? If there is, you must get through it, not by ignoring it as an irritation, or by going up and over it, but by facing it and getting through it into the presence of Jesus Christ. Then that very problem itself, and all that you have been through in connection with it, will glorify Jesus Christ in a way that you will never know until you see Him face to face.","We must be able to “mount up with wings like eagles” (Isaiah 40:31), but we must also know how to come down. The power of the saint lies in the coming down and in the living that is done in the valley. Paul said, “I can do all things through Christ who strengthens me” (Philippians 4:13) and what he was referring to were mostly humiliating things. And yet it is in our power to refuse to be humiliated and to say, “No, thank you, I much prefer to be on the mountaintop with God.” Can I face things as they actually are in the light of the reality of Jesus Christ, or do things as they really are destroy my faith in Him, and put me into a panic?"]},"prayer":["Micah Kongkousonh’s family","Jirah","Russo","Carrie Davis","Moondog","Stephanie Lippi"],"creative":{"date":"Oct 3","title":"","paragraphs":["InBird by Bird, her phenomenal book on writing, Anne Lamott shared the story of a time when her younger brother was overwhelmed by a school project. He was supposed to categorize a large number of birds but had put off the project until the last minute. Distraught, he sat at the kitchen table ready to break down in tears. Lamott’s father sat beside him, put his arm around him, and said, “Bird by bird, buddy. Just take it bird by bird.”","It’s easy to feel overwhelmed with the amount of work required to complete a project. Sometimes that feeling is due to a lack of definition of the work, and sometimes it’s the result of an overall sense that we’re never going to get it done.","In both cases, charting a clear, measurable course for completion is the best approach.","Break the work down into manageable chunks. Make a list of those chunks. Block time for each chunk. Then take it chunk by chunk. It’s amazing how simply making a small amount of progress can lighten your spirits and cultivate a sense of momentum.","What is the “bird” you need to complete next to make progress on an important project?","All creative work is accomplished task by task. Don’t allow the weight of the undone tasks to cause you to despair. Take them one at a time."],"question":"What is the next task that you need to complete?"}},"fitness":{"eyebrow":"Tomorrow · Sunday · Rest day","stats":[{"value":"228.8","label":"lb weekly avg"},{"value":"~0.5","label":"lb/wk, goal 1.2"},{"value":"6.9h","label":"sleep avg"},{"value":"6,650","label":"steps/day"}],"progress":[{"label":"Weight","text":"228.8 lb avg this week (6 weigh-ins), losing about 0.5 lb/wk over 3 weeks; goal needs 1.2 lb/wk; sustainable range 1.1-2.3 lb/wk. That is under 0.5% a week, so progress has stalled."},{"label":"Nutrition (Sep 26–Oct 2)","text":"2,155 kcal avg vs 2,308, protein 180g avg vs 200g, 6 of 7 days at 180g+. Only Oct 1 dipped (138g). All 7 days now match MyFitnessPal."},{"label":"Strength","text":"Leg press 205 to 250 lb and stiff leg deadlift 100 to 135 lb in a week. Front raise up 5 lb. DB bench holding at 45 lb, row steady at 80 lb. Leg extension set 3 flagged \"struggled.\" Back & Triceps last done Sep 23 (10 days)."},{"label":"Recovery","text":"6.9h avg sleep, but four short nights Sep 28–Oct 1 (about 5.5h each). Today reads normal: RHR 71 vs 70 avg, HRV 65 vs 53."},{"label":"Activity","text":"6,650 steps/day avg (target 10,000). Walks this week: 3 sessions, 6.9 mi, 136 min."}],"closing":"Food and lifting are working; the scale is 3 weeks behind goal pace, so tighten logging on concert and weekend days before touching the target. Sleep is the other gap: get 7h tonight and tomorrow, and protect Wednesday's Back & Triceps at 8 AM.","goals":[{"name":"Strength sessions","done":2,"total":3},{"name":"Off Day
