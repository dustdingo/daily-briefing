.","The New Testament teaching about regeneration is that when a person is hit by his own sense of need, God will put the Holy Spirit into his spirit, and his personal spirit will be energized by the Spirit of the Son of God—“. . . until Christ is formed in you” (Galatians 4:19). The moral miracle of redemption is that God can put a new nature into me through which I can live a totally new life. When I finally reach the edge of my need and know my own limitations, then Jesus says, “Blessed are you . . .” (Matthew 5:11). But I must get to that point. God cannot put into me, the responsible moral person that I am, the nature that was in Jesus Christ unless I am aware of my need for it.","Just as the nature of sin entered into the human race through one man, the Holy Spirit entered into the human race through another Man (see Romans 5:12–19). And redemption means that I can be delivered from the heredity of sin, and that through Jesus Christ I can receive a pure and spotless heredity, namely, the Holy Spirit."]},"prayer":["Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Oct 6","title":"","summary":"","paragraphs":["Unnecessary complexity isn’t just a function of making a problem too complex or creating pointlessly difficult processes that have to be followed to do the work. Yes, bureaucratic red tape can inhibit creative effectiveness, but sometimes it’s the smaller things that stand in the way of focus and clarity. Scheduling meetings, back-and-forth email volleys, and other activities that require you to spend energy that’s not directly tied to the value you are tasked with creating can zap the drive you need to deliver great work at the right moment.","I am a big believer in automating as much work as possible. With the array of tools at your disposal, there is really no excuse for wasting precious creative time on anything that can be fully automated. Given the amount of uncertainty that must be resolved in the course of the work you do, strive to eliminate as much pointless uncertainty as possible by automating tasks that don’t really require your decision-making prowess. What in your life should be automated so as to free up creative mental cycles?","Automate as much of your process as possible so that you can spend your valuable creative cycles on work that truly matters."],"question":"Question: Which elements of your work could be automated to free mental bandwidth?"}}}</script>
