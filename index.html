ry":["God trained Moses in the wilderness before sending him. Discouragement after a clear vision can be the season where He teaches us His stride, not our own."],"fullText":["“. . . when Moses was grown . . . he went out to his brethren and looked at their burdens.”","Moses saw the oppression of his people and felt certain that he was the one to deliver them, and in the righteous indignation of his own spirit he started to right their wrongs. After he launched his first strike for God and for what was right, God allowed Moses to be driven into empty discouragement, sending him into the desert to feed sheep for forty years. At the end of that time, God appeared to Moses and said to him, “ ‘. . . bring My people . . . out of Egypt.’ But Moses said to God, ‘Who am I that I should go . . . ?’” (Exodus 3:10–11). In the beginning Moses had realized that he was the one to deliver the people, but he had to be trained and disciplined by God first. He was right in his individual perspective, but he was not the person for the work until he had learned true fellowship and oneness with God.","We may have the vision of God and a very clear understanding of what God wants, and yet when we start to do it, there comes to us something equivalent to Moses’ forty years in the wilderness. It’s as if God had ignored the entire thing, and when we are thoroughly discouraged, God comes back and revives His call to us. And then we begin to tremble and say, “Who am I that I should go . . . ?” We must learn that God’s great stride is summed up in these words—“I AM WHO I AM . . . has sent me to you” (Exodus 3:14). We must also learn that our individual effort for God shows nothing but disrespect for Him—our individuality is to be rendered radiant through a personal relationship with God, so that He may be “well pleased” (Matthew 3:17). We are focused on the right individual perspective of things; we have the vision and can say, “I know this is what God wants me to do.” But we have not yet learned to get into God’s stride. If you are going through a time of discouragement, there is a time of great personal growth ahead."]},"prayer":["Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Oct 13","title":"","summary":"","paragraphs":["A technique calledbrachiationis an important phase of physical development for children. For example, when a child is swinging from one side to the other on a set of monkey bars, there is a moment when they must let go with one hand before the other hand is fully secured on the next bar. If they fail to let go at the right moment, as often happens when they get scared, they will likely fall (or be stuck between the two bars with no momentum).","A key reason why they don’t let go at the right moment is a fear of falling. Ironically, that fear is self-fulfilling. It’s precisely because they don’t let go that they fall. You must learn to let go at just the right time—not too early but still at some point before you know for certain that everything is going to work out fine.","Creative work is very similar. You have to know how to let go of an idea and move on to the next one. If you don’t and try to grasp onto it long after it has served its purpose, you are likely to end up with something mediocre.","We all mastered this skill as children, but emotional brachiation can be much more difficult. There is so much of our self-identity wrapped up in our ideas or projects. However, we need to train ourselves to let go and move forward.","If you don’t know when to let go of an old idea and move on to the next one, you are destined to struggle creatively."],"question":"Question: Are there any old ideas—or anything at all in your life—that you simply need to let go of so you can grasp ahold of the next one?"}},"fitness":{"eyebrow":"Tomorrow · Wednesday · Travel day (SALT)","stats":[{"value":"228.3","la           card("warn", [h("h2", { style: "color:var(--warn)", text: "Missed and overdue" }), h("div", { class: "stack", style: "gap:10px" }, W.overdue.map(function (o) {
            return h("div", { class: "row between", style: "font-size:14px" },
              h("span", { style: "display:flex;align-items:center;gap:8px" }, dot(o.role), o.title),
              h("span", { style: "flex:0 0 auto;font-size:12px;font-weight:600;color:var(--warn)", text: role(o.role).name + " · " + o.due }));
          }))])),
        h("div", { style: "padding:24px 24px 4px" }, h("h2", { class: "sec", text: "Projects" })),
        h("div", { class: "grid", style: "padding-top:12px" }, W.projects.map(function (j) {
          var r = role(j.role);
          return h("div", { class: "card stack " + r.cls },
            h("div", { class: "band" }, svg(r.d, 24), h("h3", { text: j.area || r.name })),
            j.roleEvaluation ? h("div", { style: "padding:12px;border-radius:14px;background:var(--bg)" }, h("div", { class: "lab", style: "color:var(--accentText)", text: "Role evaluation" }), h("div", { style: "font-size:14px", text: j.roleEvaluation })) : null,
            j.blocks.map(function (b) {
              return h("div", null, h("div", { class: "lab", text: b.label }),
                b.lines.map(function (l) { return h("div", { style: "font-size:14px", text: (b.lines.length > 1 ? "– " : "") + l }); }));
            }));
        }))];
    } else {
      body = h("div", { class: "grid", style: "padding-top:20px" },
        W.calendar.map(function (c) {
          return h("div", { class: "card cal", style: "padding:6px 18px 10px" },
            h("div", { style: "padding:12px 0 4px" }, h("div", { class: "lab", style: "color:var(--accentText);letter-spacing:.08em", text: c.kicker }), h("h2", { style: "margin:2px 0 0", text: c.title })),
            c.rows.map(function (r) {
              return h("div", { class: "r" + (r.fyi ? " fyi" : "") }, h("div", { class: "d", text: r.day || "" }),
                h("div", { style: "flex:1" }, h("b", { text: r.time ? r.time + " " : "" }), r.title));
            }));
        }),
        W.calendarNote ? h("div", { class: "foot", text: W.calendarNote }) : null);
    }
    return h("section", { "aria-label": "Weekly overview" },
      h("div", { class: "head" }, h("div", { class: "eyebrow", text: W.rangeLabel }), h("h1", { style: "margin-top:8px", text: "Weekly overview" }),
        seg(views, state.wv, function (id) { state.wv = id; render(); })),
      body);
  }

  // ---------- shell ----------
  var SCREENS = { today: today, brief: brief, reading: reading, fitness: fitness, time: time, travel: travel, week: week };
  function render() {
    var view = document.getElementById("view");
    view.textContent = "";
    view.appendChild(SCREENS[state.tab]());
    var nav = document.getElementById("nav");
    nav.textContent = "";
    TABS.forEach(function (t) {
      nav.appendChild(h("button", { "aria-pressed": t.id === state.tab ? "true" : "false", "aria-label": t.label,
        onclick: function () { state.tab = t.id; try { history.replaceState(null, "", "#" + t.id); } catch (e) {} window.scrollTo(0, 0); render(); } },
        svg(t.d, 24), h("span", { text: t.label })));
    });
  }
  render();
})();
</script>
