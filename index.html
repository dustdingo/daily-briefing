*{box-sizing:border-box}

ry airs Sunday","text":"Nothing for it is in Things this week. Confirm the Lloyds and Easley edit is on track."},{"role":"SPS","title":"Storyteller 101 status file","text":"project_status.md was last updated Sep 28 and still shows the Oct 13 shoot as upcoming. projects.md says main teaching is filmed."}],"whatsNext":[{"title":"Finish Preproduction","text":"Due today; it clears the top Freelance item."},{"title":"Grade Newspaper Article Design #2","text":"Five days overdue, and five more grading tasks are due Friday."},{"title":"Propose FILO Foundations speakers","text":"Due tomorrow; faculty names to Kristen Friday, before the 11:30 Track Leader Connect."},{"title":"Turn the 2027 SPS goals into a schedule","text":"On Today since Oct 7. The January Storyteller 101 launch still needs Module 6."},{"title":"Get a strength session logged","text":"Nothing since Nov 2. Back & Triceps today, Legs & Shoulders Friday."}],"opportunities":[{"role":"SPS","title":"2027 cadence calendar","text":"Placing 12 seminars, 12 webinars and 26 YouTube videos on a calendar now shows what January can actually hold."},{"role":"Speaking","title":"FILO speaker proposals","text":"Getting them in a day early sets up Friday's Track Leader Connect."},{"role":"Teaching","title":"Week 13 intro and Week 5 announcement","text":"Recording both on an OOO day clears Sunday and Monday's deadlines."}],"projectCards":[{"role":"SPS","level":"High","why":"Status: Storyteller 101 main teaching is filmed, but Module 6 and the landscape shoot are still open for the January launch. No SPS time logged since the week of Oct 12.","best":"Today's move: finish the 2027 schedule and goals task by mapping the four goals (monthly seminar, monthly webinar, two training series, bi-weekly YouTube) month by month.","watch":"Morning block: 5:30-7:15 AM, full window, nothing before drop-off. project_status.md is stale (Sep 28); projects.md is current."},{"role":"Freelance","level":"High","why":"Preproduction is due today; the Awaken Church story airs Sun Nov 15.","best":"Preproduction in the 12:00-4:30 block.","watch":"American Integrity: Today in Things is EDIT 16 Alexandra Rodriguez (tracker: awaiting client feedback). Next 20th anniversary edit is Dick Dowd, Nov 25."},{"role":"Teaching","level":"High","why":"Newspaper #2 is overdue and five grading tasks are due Fri Nov 13.","best":"Grade Newspaper #2 today, the Friday batch tomorrow morning.","watch":"RESPOND to Discussion 4 and the Week 13 intro are due Sun Nov 15."},{"role":"Speaking","level":"Medium","why":"Follow up RE: Article 2 is on Today; FILO proposals are due tomorrow.","best":"Do the follow-up and the speaker proposals together this afternoon.","watch":"Faculty names to Kristen Fri Nov 13, plus the FILO Track Leader Connect at 11:30 AM."},{"role":"Seacoast","level":"Low","why":"You're out through Thursday.","best":"Nothing needed today.","watch":"Back Fri Nov 13; Weekend Debrief, Christmas Decor and Film Team Weekly on Mon Nov 16."}]},"reading":{"devotional":{"series":"My Utmost for His Highest","date":"Nov 11","title":"THE SUPREME CLIMB","reference":"Genesis 22:2","summary":["Obey God now, not later, and don't confer with flesh and blood.","Abraham didn't choose the sacrifice; never decide the place of your own martyrdom. Go through the trial and you learn to know God better."],"fullText":["“He said, ‘Take now your son . . . .’ ”","God’s command is, “Take now ,” not later. It is incredible how we debate! We know something is right, but we try to find excuses for not doing it immediately. If we are to climb to the height God reveals, it can never be done later—it must be done now. And the sacrifice must be worked through our will before we actually perform it.","“So Abraham rose early in the morning . . . and went to the place of which God had told him” (22:3). Oh, the wonderful simplicity of Abraham! When God spoke, he did not “confer with flesh and blood” (Galatians 1:16). Beware when you want to “confer with flesh and blood” or even your own thoughts, insights, or understandings—anything that is not based on your personal relationship with God. These are all things that compete with and hinder obedience to God.","Abraham did not choose what the sacrifice would be. Always guard against self-chosen service for God. Self-sacrifice may be a disease that impairs your service. If God has made your cup sweet, drink it with grace; or even if He has made it bitter, drink it in communion with Him. If the providential will of God means a hard and difficult time for you, go through it. But never decide the place of your own martyrdom, as if to say, “I will only go to there, but no farther.” God chose the test for Abraham, and Abraham neither delayed nor protested, but steadily obeyed. If you are not living in touch with God, it is easy to blame Him or pass judgment on Him. You must go through the trial before you have any right to pronounce a verdict, because by going through the trial you learn to know God better. God is working in us to reach His highest goals until His purpose and our purpose become one."]},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Phillip - Reconciliation with his Sisters","Eliana Gale - Dropped Class","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Nov 11","title":"","summary":"","paragraphs":["Our instincts keep us safe, help us navigate relationships, and help us discern between good and bad ideas.","However, our instincts can also mislead us. It’s possible to react in the moment instead of responding meaningfully and with reasoned wisdom. When we react instead of responding, we make very bad decisions that we may have to live with for months or longer afterward.","To react is to operate purely on instinct. To respond is to listen to your instincts but pause and allow wisdom and experience to guide your actions. When we respond rather than reacting, we are far more likely to make wise choices and far less likely to cause ourselves trouble down the line.","Does this ring true to you? Can you think of moments in your life, your work, or your relationships where reaction got you into trouble and a more measured response would have served you better?","When you react, you are operating purely on instinct. Brilliant creative work is forged when instinct is in submission to wisdom and experience."],"question":"Question: Where might you be tempted to react rather than respond this week? How can you prevent it?"}},"fitness":{"eyebrow":"Wednesday · Back & Triceps","stats":[{"value":"224.7","label":"lb weekly avg (Nov 2-8)"},{"value":"2,175","label":"avg kcal, Nov 4-10"},{"value":"138","label":"avg protein g, Nov 4-10"},{"value":"7.0","label":"avg sleep h, last 6 nights"}],"progress":[{"label":"Weight","text":"224.7 lb avg (Nov 2-8, 2 weigh-ins), down from 226.4 (Oct 19-25), about 0.9 lb/wk. That's under the sustainable 1.1-2.2 lb/wk range, so progress is slow. Goal (199 by Mar 28) needs 1.3 lb/wk. No weigh-in since Nov 4."},{"label":"Nutrition","text":"Nov 4-10 averaged 2,175 kcal (target 2,308) and 138g protein (target 200), with 3 days at 180g+. Fri-Sun (Nov 6-8) ran 65-95g protein; Nov 6 looks partly logged."},{"label":"Strength","text":"Row is up to 90 lb; bench holding at 45 lb x10. Assisted pull-ups struggled twice. Nothing logged since Nov 2, and Legs & Shoulders not since Oct 9."},{"label":"Recovery","text":"7.0h average over 6 nights, with short ones Nov 5 (5.7h) and Nov 10 (6.3h). RHR 65 and HRV 46 are in line with the week, so recovery is normal."},{"label":"Activity","text":"About 4,300 steps a day Nov 5-10. One walk on the Watch this week: 2.2 mi Monday."}],"closing":"Protein on weekends is the gap, and the scale is moving slower than the goal needs. Get Back & Triceps in today and log it; a second shake on Fri-Sun closes mo
