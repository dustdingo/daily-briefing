*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}

rist's atonement, not our own experience, is the foundation for faith and holiness.","Obedience means trusting the atonement completely, and grace meets it."],"fullText":["“. . . present . . . your members as instruments of righteousness to God.”","I cannot save and sanctify myself; I cannot make atonement for sin; I cannot redeem the world; I cannot right what is wrong, purify what is impure, or make holy what is unholy. That is all the sovereign work of God. Do I have faith in what Jesus Christ has done? He has made the perfect atonement for sin. Am I in the habit of constantly realizing it? The greatest need we have is not to do things, but to believe things. The redemption of Christ is not an experience, it is the great act of God which He has performed through Christ, and I have to build my faith on it. If I construct my faith on my own experience, I produce the most unscriptural kind of life—an isolated life, with my eyes focused solely on my own holiness. Beware of that human holiness that is not based on the atonement of the Lord. It has no value for anything except a life of isolation—it is useless to God and a nuisance to man. Measure every kind of experience you have by our Lord Himself. We cannot do anything pleasing to God unless we deliberately build on the foundation of the atonement by the Cross of Christ.","The atonement of Jesus must be exhibited in practical, unassuming ways in my life. Every time I obey, the absolute deity of God is on my side, so that the grace of God and my natural obedience are in perfect agreement. Obedience means that I have completely placed my trust in the atonement, and my obedience is immediately met by the delight of the supernatural grace of God.","Beware of the human holiness that denies the reality of the natural life—it is a fraud. Continually bring yourself to the trial or test of the atonement and ask, “Where is the discernment of the atonement in this, and in that?”"]},"prayer":["Micah Kongkousonh's family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Oct 9","title":"","summary":"","paragraphs":["Steady, deliberate progress is the key to making meaningful progress on big, complex projects. In their (already referenced!) bookGreat by Choice, Jim Collins and Morten T. Hansen share the hypothetical story of two people walking across the United States. One sets out on the first day, which was beautiful, walks twenty miles, then stops. The other, because it’s beautiful, decides to walk forty miles. The following day, the temperature is unbearably hot, but the first person again walks twenty miles. The other person, already worn out from the big first day effort, decides to wait for more optimal conditions to trek again. This goes on for day after day, in good and bad conditions. Who will arrive at their destination first?","Collins argues that successful companies (and I would add people as well) are those who commit to the twenty-mile march even when they don’t feel like it or when conditions aren’t optimal.","For you, that might mean doing a specific number of hours of work on a project each day, writing a certain number of words no matter your circumstances, or having your check-in meeting even when it’s inconvenient. By committing to steady, deliberate progress, you are more likely to arrive at your destination than if you only do work when you feel inspired to.","Commit to steady, deliberate, measured progress on your big projects. And do it every day, even when you don’t feel like it."],"question":"What is your twenty-mile march right now?"}},"fitness":{"eyebrow":"Tomorrow · Saturday · Rest day","stats":[{"value":"228.3","label":"lb weekly avg"},{"value":"0.5","label":"lb/wk lost (3 wks)"},{"value":"176g","label":"protein avg"},{"value":"5,083","label":"steps/day"}],"progress":[{"label":"Weight","text":"228.3 lb avg this week, losing about 0.5 lb/wk over           var r = role(j.role);
          return h("div", { class: "card stack " + r.cls },
            h("div", { class: "band" }, svg(r.d, 24), h("h3", { text: j.area || r.name })),
            j.roleEvaluation ? h("div", { style: "padding:12px;border-radius:14px;background:var(--bg)" }, h("div", { class: "lab", style: "color:var(--accentText)", text: "Role evaluation" }), h("div", { style: "font-size:14px", text: j.roleEvaluation })) : null,
            j.blocks.map(function (b) {
              return h("div", null, h("div", { class: "lab", text: b.label }),
                b.lines.map(function (l) { return h("div", { style: "font-size:14px", text: (b.lines.length > 1 ? "– " : "") + l }); }));
            }));
        }))];
    } else {
      body = h("div", { class: "grid", style: "padding-top:20px" },
        W.calendar.map(function (c) {
          return h("div", { class: "card cal", style: "padding:6px 18px 10px" },
            h("div", { style: "padding:12px 0 4px" }, h("div", { class: "lab", style: "color:var(--accentText);letter-spacing:.08em", text: c.kicker }), h("h2", { style: "margin:2px 0 0", text: c.title })),
            c.rows.map(function (r) {
              return h("div", { class: "r" + (r.fyi ? " fyi" : "") }, h("div", { class: "d", text: r.day || "" }),
                h("div", { style: "flex:1" }, h("b", { text: r.time ? r.time + " " : "" }), r.title));
            }));
        }),
        W.calendarNote ? h("div", { class: "foot", text: W.calendarNote }) : null);
    }
    return h("section", { "aria-label": "Weekly overview" },
      h("div", { class: "head" }, h("div", { class: "eyebrow", text: W.rangeLabel }), h("h1", { style: "margin-top:8px", text: "Weekly overview" }),
        seg(views, state.wv, function (id) { state.wv = id; render(); })),
      body);
  }

  // ---------- shell ----------
  var SCREENS = { today: today, brief: brief, reading: reading, fitness: fitness, time: time, travel: travel, week: week };
  function render() {
    var view = document.getElementById("view");
    view.textContent = "";
    view.appendChild(SCREENS[state.tab]());
    var nav = document.getElementById("nav");
    nav.textContent = "";
    TABS.forEach(function (t) {
      nav.appendChild(h("button", { "aria-pressed": t.id === state.tab ? "true" : "false", "aria-label": t.label,
        onclick: function () { state.tab = t.id; try { history.replaceState(null, "", "#" + t.id); } catch (e) {} window.scrollTo(0, 0); render(); } },
        svg(t.d, 24), h("span", { text: t.label })));
    });
  }
  render();
})();
</script>
</body>
