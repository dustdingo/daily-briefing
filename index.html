God Himself . . .","At any cost, dear Lord, by any road.","“At any cost . . . by any road” means submitting to God’s way of bringing us to the goal. There is no possibility of questioning God when He speaks, if He speaks to His own nature in me. Prompt obedience is the only result. When Jesus says, “Come,” I simply come; when He says, “Let go,” I let go; when He says, “Trust God in this matter,” I trust. This work of obedience is the evidence that the nature of God is in me.","God’s revelation of Himself to me is influenced by my character, not by God’s character.","’Tis because I am ordinary,","Thy ways so often look ordinary to me.","It is through the discipline of obedience that I get to the place where Abraham was and I see who God is. God will never be real to me until I come face to face with Him in Jesus Christ. Then I will know and can boldly proclaim, “In all the world, my God, there is none but Thee, there is none but Thee.”","The promises of God are of no value to us until, through obedience, we come to understand the nature of God. We may read some things in the Bible every day for a year and they may mean nothing to us. Then, because we have been obedient to God in some small detail, we suddenly see what God means and His nature is instantly opened up to us. “All the promises of God in Him are Yes, and in Him Amen . . .” (2 Corinthians 1:20). Our “Yes” must be born of obedience; when by obedience we ratify a promise of God by saying, “Amen,” or, “So be it.” That promise becomes ours."]},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Phillip - Reconciliation with his Sisters","Eliana Gale - Dropped Class","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Nov 17","title":"","summary":"","paragraphs":["When do you do your most effective thinking? Some people jump out of bed and are halfway into their work before they even hit their desk, while others seem to do their best creative work late in the evening or even after hours. Unfortunately, most of us do not have an option to work whenever we want to. However, that doesn’t mean that you can’t take advantage of those extra productive times, even if they fall outside your normal work hours.","Some creative pros set aside time very early in the morning to do their creative thinking, before they go into the office. Yes, I understand that it’s important to have a separation between work space and home life, but for some people, those precious few hours in the morning or the evening after everyone else is in bed might actually save us many hours of trying to think while juggling all our daytime priorities. An hour in the morning or evening might actually save us five later.","When do you do your best creative thinking? Strive to block off just a bit of time this week during that optimum time for idea work.","Dedicate your best creative thinking time for generating ideas, even if that’s in the morning or evening."],"question":"Question: When do your best ideas generally happen? How can you structure more thought time during those windows?"}},"fitness":{"eyebrow":"Tuesday · Off Day Circuit","stats":[{"value":"227.4","label":"lb, Nov 12 weigh-in"},{"value":"2,365","label":"avg kcal, 5 full days Nov 10-16"},{"value":"151","label":"avg protein g, same days"},{"value":"6.9","label":"avg sleep h, 6 nights"}],"progress":[{"label":"Weight","text":"No weigh-in since 227.4 lb on Nov 12, so no weekly average yet. Goal 199 by Mar 28 needs about 1.5 lb/wk, inside the sustainable 1.1-2.3 lb/wk range. Step on the scale a few mornings this week."},{"label":"Nutrition","text":"Five full days (Nov 10, 12, 13, 14, 16) averaged 2,365 kcal (target 2,308) and 151g protein (target 200). Only Nov 10 and 13 hit 180g. Nov 11 (two meals) and Nov 15 (no breakfast) look incomplete."},{"label":"Strength","te
