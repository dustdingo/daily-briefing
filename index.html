ight, and the Hanahan Business Mixer (6-8 PM) crowds it."},{"role":"Seacoast","level":"Medium","why":"Back Monday into a heavy week: New Year's at Home setup Mon 4-7 PM, the shoot Tue, MCC filming Wed, Awaken Church Thu, Connect story Sat.","best":"Use Monday morning to prep gear for Tuesday.","watch":"Monday's setup runs to 7 PM, into family time."}]},"reading":{"devotional":{"series":"My Utmost for His Highest","date":"Oct 16","title":"THE KEY TO THE MASTER’S ORDERS","reference":"Matthew 9:38","summary":["The key to the work God gives is prayer, not busy activity. Jesus calls us to Himself, not to a special work, and as we pray the Lord of the harvest He sends us out as His laborers."],"fullText":["“Pray the Lord of the harvest to send out laborers into His harvest.”","The key to the missionary’s difficult task is in the hand of God, and that key is prayer, not work—that is, not work as the word is commonly used today, which often results in the shifting of our focus away from God. The key to the missionary’s difficult task is also not the key of common sense, nor is it the key of medicine, civilization, education, or even evangelization. The key is in following the Master’s orders—the key is prayer. “Pray the Lord of the harvest . . . .” In the natural realm, prayer is not practical but absurd. We have to realize that prayer is foolish from the commonsense point of view.","From Jesus Christ’s perspective, there are no nations, but only the world . How many of us pray without regard to the persons, but with regard to only one Person—Jesus Christ? He owns the harvest that is produced through distress and through conviction of sin. This is the harvest for which we have to pray that laborers be sent out to reap. We stay busy at work, while people all around us are ripe and ready to be harvested; we do not reap even one of them, but simply waste our Lord’s time in over-energized activities and programs. Suppose a crisis were to come into your father’s or your brother’s life—are you there as a laborer to reap the harvest for Jesus Christ? Is your response, “Oh, but I have a special work to do!” No Christian has a special work to do. A Christian is called to be Jesus Christ’s own, “a servant [who] is not greater than his master” (John 13:16), and someone who does not dictate to Jesus Christ what he intends to do. Our Lord calls us to no special work—He calls us to Himself. “Pray the Lord of the harvest,” and He will engineer your circumstances to send you out as His laborer."]},"prayer":["Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Oct 16","title":"","summary":"","paragraphs":["If you go into a grocery store, you’ll see that items are typically placed together that are frequently purchased together. For example, you won’t find the toothpaste with the asparagus (although that actually might not be a bad idea!). You’ll find it next to the toothbrushes, because people who are looking for one item are more likely to also be looking for the other. This is a concept in store planning called “intelligent adjacency,” and it’s designed to make things more convenient for the shopper but also to increase likely impulse purchases.","There is another kind of intelligent adjacency that applies to your time and focus. It’s often the case that you spend ten minutes answering an email, then a half hour in a meeting, then fifteen minutes actually doing deep creative work, then another ten answering an email, etc. When you bounce between different kinds of tasks like these, you pay a task-switching penalty, and your overall effectiveness is likely to suffer. Instead, consider how you might be able to group certain kinds of similar tasks together so that you are not shifting your mindset as often between highly conceptual creative work and highly tactical administrative work. Try to block space for each           var r = role(j.role);
          return h("div", { class: "card stack " + r.cls },
            h("div", { class: "band" }, svg(r.d, 24), h("h3", { text: j.area || r.name })),
            j.roleEvaluation ? h("div", { style: "padding:12px;border-radius:14px;background:var(--bg)" }, h("div", { class: "lab", style: "color:var(--accentText)", text: "Role evaluation" }), h("div", { style: "font-size:14px", text: j.roleEvaluation })) : null,
            j.blocks.map(function (b) {
              return h("div", null, h("div", { class: "lab", text: b.label }),
                b.lines.map(function (l) { return h("div", { style: "font-size:14px", text: (b.lines.length > 1 ? "– " : "") + l }); }));
            }));
        }))];
    } else {
      body = h("div", { class: "grid", style: "padding-top:20px" },
        W.calendar.map(function (c) {
          return h("div", { class: "card cal", style: "padding:6px 18px 10px" },
            h("div", { style: "padding:12px 0 4px" }, h("div", { class: "lab", style: "color:var(--accentText);letter-spacing:.08em", text: c.kicker }), h("h2", { style: "margin:2px 0 0", text: c.title })),
            c.rows.map(function (r) {
              return h("div", { class: "r" + (r.fyi ? " fyi" : "") }, h("div", { class: "d", text: r.day || "" }),
                h("div", { style: "flex:1" }, h("b", { text: r.time ? r.time + " " : "" }), r.title));
            }));
        }),
        W.calendarNote ? h("div", { class: "foot", text: W.calendarNote }) : null);
    }
    return h("section", { "aria-label": "Weekly overview" },
      h("div", { class: "head" }, h("div", { class: "eyebrow", text: W.rangeLabel }), h("h1", { style: "margin-top:8px", text: "Weekly overview" }),
        seg(views, state.wv, function (id) { state.wv = id; render(); })),
      body);
  }

  // ---------- shell ----------
  var SCREENS = { today: today, brief: brief, reading: reading, fitness: fitness, time: time, travel: travel, week: week };
  function render() {
    var view = document.getElementById("view");
    view.textContent = "";
    view.appendChild(SCREENS[state.tab]());
    var nav = document.getElementById("nav");
    nav.textContent = "";
    TABS.forEach(function (t) {
      nav.appendChild(h("button", { "aria-pressed": t.id === state.tab ? "true" : "false", "aria-label": t.label,
        onclick: function () { state.tab = t.id; try { history.replaceState(null, "", "#" + t.id); } catch (e) {} window.scrollTo(0, 0); render(); } },
        svg(t.d, 24), h("span", { text: t.label })));
    });
  }
  render();
})();
</script>
</body>
