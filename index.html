ur Lord’s life there was none of the pressure and the rushing of tremendous activity that we regard so highly today, and a disciple is to be like His Master. The central point of the kingdom of Jesus Christ is a personal relationship with Him, not public usefulness to others.","It is not the practical activities that are the strength of this Bible Training College—its entire strength lies in the fact that here you are immersed in the truths of God to soak in them before Him. You have no idea of where or how God is going to engineer your future circumstances, and no knowledge of what stress and strain is going to be placed on you either at home or abroad. And if you waste your time in overactivity, instead of being immersed in the great fundamental truths of God’s redemption, then you will snap when the stress and strain do come. But if this time of soaking before God is being spent in getting rooted and grounded in Him, which may appear to be impractical, then you will remain true to Him whatever happens."]},"prayer":["Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Oct 19","title":"","summary":"","paragraphs":["As I write this, the world is beginning to emerge from a global pandemic. While technology allowed many to work remotely in a way that was never before possible, that gift was accompanied by certain struggles, such as creative burnout. In the face of uncertainty and especially when the entire world has been turned upside down, many pros did everything they could to hold things together. However, the emotional toll of creating under pressure every day inevitably led to a sense of overload.","Here are six quick tips for dealing with these moments of burnout:","For creative pros, burnout is at some point inevitable. You need to have a plan for dealing with it when it happens."],"question":"Is there any place in your li
