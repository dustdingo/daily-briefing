thless things. Never protest by saying, “If only I were somewhere else!” All of God’s people are ordinary people who have been made extraordinary by the purpose He has given them. Unless we have the right purpose intellectually in our minds and lovingly in our hearts, we will very quickly be diverted from being useful to God. We are not workers for God by choice. Many people deliberately choose to be workers, but they have no purpose of God’s almighty grace or His mighty Word in them. Paul’s whole heart, mind, and soul were consumed with the great purpose of what Jesus Christ came to do, and he never lost sight of that one thing. We must continually confront ourselves with one central fact—“. . . Jesus Christ and Him crucified” (1 Corinthians 2:2).","“I chose you . . .” (John 15:16). Keep these words as a wonderful reminder in your theology. It is not that you have gotten God, but that He has gotten you. God is at work bending, breaking, molding, and doing exactly as He chooses. And why is He doing it? He is doing it for only one purpose—that He may be able to say, “This is My man, and this is My woman.” We have to be in God’s hand so that He can place others on the Rock, Jesus Christ, just as He has placed us.","Never choose to be a worker, but once God has placed His call upon you, woe be to you if you “turn aside . . . to the right or the left . . .” (Deuteronomy 28:14). He will do with you what He never did before His call came to you, and He will do with you what He is not doing with other people. Let Him have His way."]},"prayer":["Samuel - Clear communication and rambling","Hope - Communicating how she feels to others","Micah Kongkousonh’s family","Natalie and Conflict Resolution + Long Distance Relationship","Lois and asking questions in relationships","Jirah","Moondog","Stephanie Lippi"],"creative":{"date":"Oct 25","title":"","summary":"","paragraphs":["Having predictable time on your calendar for important priorities is critical to making progress on creative work. Without knowing that you’ll have the time you need to do the work, you are prone to stress and anxiety, which can consume your world and choke your creative energy.","One strategy that was implemented by a client of mine was called “no-fly zone” time. The policy stated that between the hours of 11:00 a.m. and 1:00 p.m. Monday through Friday, there were to be no meetings, no phone calls, and no expectations of returned emails. Everyone in the organization had that predictable two hours every single day to do their deep creative work. What this did for the organization was provide steady, predictable windows for people to do their work, regardless of how many meetings they had to sit through outside it. They knew that at least ten hours a week would go to the work they were accountable for.","How can you implement the same strategy in your life? Is there a window you can block off as “no-fly zone” time? Maybe it’s 7:00 to 9:00 each morning, as you ease into your day. Maybe it’s 3:00 to 5:00 each afternoon so that you can leave on a high note, having tackled important priorities.","Block some time each week, preferably each day, for doing your most important creative work."],"question":"When will you schedule “no-fly zone” time?"}},"fitness":{"eyebrow":"Sunday · Rest day","stats":[{"value":"226.4","label":"lb weekly avg (Oct 19-24)"},{"value":"0.8","label":"lb/wk actual (3 wks)"},{"value":"1.2","label":"lb/wk needed"},{"value":"22","label":"weeks to goal"}],"progress":[{"label":"Weight","text":"226.4 lb avg this week (5 weigh-ins, low of 225.0 on Oct 24), losing about 0.8 lb/wk since 228.9 the week of Sep 28. Goal of 199 lb by Mar 28 (last read from goals) needs 1.2 lb/wk; sustainable range 1.1-2.3 lb/wk. Progress is below 0.5% a week, so it has slowed."},{"label":"Nutrition","text":"Not readable this morning (Wellness daily limit), and no MyFitnessPal export has arrived since Oct 5."},{"label":"Strength","text":"Not available this morning (Wellness daily lim
