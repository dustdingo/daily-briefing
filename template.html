<style>

  --teaching:#D97706;--teachingBg:#FEF3C7;--freelance:#1F2937;--freelanceBg:#F3F1ED;--personal:#726C67;--personalBg:#F3F1ED;
  --display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151312;--surface:#1F1C1A;--ink:#F3EFEA;--muted:#A39C95;--line:#34302D;--faint:#6F7C88;
    --accent:#E7E2DC;--onAccent:#151312;--accentText:#E7E2DC;
    --warn:#F2A272;--warnBg:#2E1C12;--warnLine:#4A2D1B;--ok:#9BCB5E;
    --speaking:#A78BFA;--speakingBg:#2A2145;--sps:#FB7185;--spsBg:#3A1520;--seacoast:#22D3EE;--seacoastBg:#0E3340;
    --teaching:#FBBF24;--teachingBg:#3A2A0A;--freelance:#CBD5E1;--freelanceBg:#26313C;--personal:#A39C95;--personalBg:#2A2623;
  }
}
:root[data-theme="dark"]{
  --bg:#151312;--surface:#1F1C1A;--ink:#F3EFEA;--muted:#A39C95;--line:#34302D;--faint:#6F7C88;
  --accent:#E7E2DC;--onAccent:#151312;--accentText:#E7E2DC;
  --warn:#F2A272;--warnBg:#2E1C12;--warnLine:#4A2D1B;--ok:#9BCB5E;
  --speaking:#A78BFA;--speakingBg:#2A2145;--sps:#FB7185;--spsBg:#3A1520;--seacoast:#22D3EE;--seacoastBg:#0E3340;
  --teaching:#FBBF24;--teachingBg:#3A2A0A;--freelance:#CBD5E1;--freelanceBg:#26313C;--personal:#A39C95;--personalBg:#2A2623;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
button{font-family:inherit}
.app{display:flex;flex-direction:column;min-height:100vh}
.main{flex:1 1 auto;min-width:0;order:1;padding-top:env(safe-area-inset-top,0)}
.page{max-width:1180px;margin:0 auto}
.nav{order:2;position:sticky;bottom:0;z-index:5;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(10px + env(safe-area-inset-bottom,0))}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;flex:1 1 0;min-width:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;color:var(--muted);font-size:11px;font-weight:600}
.nav button[aria-pressed="true"]{color:var(--accentText);background:var(--bg)}
.nav button:focus-visible,.seg button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (min-width:860px){
  .app{flex-direction:row}
  .nav{order:0;top:0;bottom:auto;align-self:flex-start;height:100vh;width:108px;flex:0 0 108px;flex-direction:column;justify-content:flex-start;gap:6px;padding:24px 10px;border-top:0;border-right:1px solid var(--line)}
}
.head{padding:28px 24px 4px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--display);font-size:36px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
h2{margin:0;font-family:var(--display);font-size:20px;font-weight:700}
h2.sec{font-size:24px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start;padding:16px 24px 32px}
.grid.tight{gap:12px;padding:12px 24px 8px}
.span{grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.card.warn{background:var(--warnBg);border-color:var(--warnLine)}

.card h2{margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.lg{gap:16px}
.col{display:flex;flex-direction:column}
.row{display:flex;gap:12px}
.between{justify-content:space-between}
.lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

.r-none{--rc:var(--faint);--rb:var(--bg)}

.dot{flex:0 0 auto;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rc)}
.band{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--rb);color:var(--rc)}
.band h2,.band h3{margin:0;flex:1;font-family:var(--display);font-size:20px;font-weight:700;color:inherit}
.badge{flex:0 0 auto;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface);color:var(--ink);border:1px solid var(--line)}

.badge.low{background:var(--bg);color:var(--muted)}
.tag{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.item{display:flex;gap:14px;align-items:flex-start}
.listrow{display:flex;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.listrow .t{flex:0 0 96px;font-size:13px;font-weight:600;color:var(--accentText)}
.bar{height:8px;border-radius:999px;background:var(--bg);overflow:hidden}
.bar.lg{height:10px}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar>i.rc{background:var(--rc)}
.bar>i.ok{background:var(--ok)}
.big{font-family:var(--display);font-weight:800;line-height:1;letter-spacing:-.03em}
.hero p{margin:0 0 12px;line-height:1.5}
.hero a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--onAccent);color:var(--accentText);font-weight:600;font-size:14px;text-decoration:none}
.note{margin-top:16px;padding:14px;border-radius:14px;background:var(--bg);font-size:14px;font-weight:600}
.foot{grid-column:1/-1;font-size:12px;color:var(--muted);text-align:center}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.stat span{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.cal .r{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.cal .d{flex:0 0 76px;font-size:13px;font-weight:600}
.cal .fyi{color:var(--muted)}
.days{display:flex;align-items:flex-end;gap:8px;height:130px}
.days>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.days i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--accent)}
.days small{font-size:11px;font-weight:600;color:var(--muted)}
.days em{font-style:normal;font-size:12px;color:var(--muted)}
.full p{margin:0 0 12px;line-height:1.55;font-size:15px}
.hide{display:none!important}
</style>
